<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    background: #0f1117;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 860px;
    height: 420px;
    font-family: 'Georgia', serif;
  }
  svg {
    width: 860px;
    height: 420px;
  }
  .group-box {
    rx: 12;
    ry: 12;
  }
  .label-title {
    font-size: 15px;
    font-weight: bold;
    fill: #e2e8f0;
    font-family: 'Georgia', serif;
  }
  .label-desc {
    font-size: 12px;
    fill: #94a3b8;
    font-family: 'Georgia', serif;
  }
  .label-math {
    font-size: 13px;
    fill: #f1f5f9;
    font-style: italic;
    font-family: 'Georgia', serif;
  }
  .arrow-label {
    font-size: 13px;
    fill: #fbbf24;
    font-weight: bold;
    font-family: 'Georgia', serif;
  }
  .section-label {
    font-size: 11px;
    fill: #64748b;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .property-text {
    font-size: 11.5px;
    fill: #cbd5e1;
    font-family: 'Georgia', serif;
  }
</style>
</head>
<body>
<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="860" height="420" fill="#0f1117"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#e2e8f0" font-family="Georgia, serif">Bilinear Pairing Structure: e : G&#x2081; × G&#x2082; &#x2192; G&#x1D54B;</text>
  <text x="430" y="56" text-anchor="middle" font-size="12" fill="#64748b" font-family="Georgia, serif">Gap Diffie-Hellman Groups — Blind BLS Setting</text>

  <!-- G1 Box -->
  <rect x="40" y="90" width="220" height="180" rx="12" ry="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="118" text-anchor="middle" class="label-title">G&#x2081;</text>
  <text x="150" y="138" text-anchor="middle" class="section-label">Source Group 1</text>
  <line x1="60" y1="148" x2="240" y2="148" stroke="#334155" stroke-width="1"/>
  <text x="150" y="170" text-anchor="middle" class="label-math">prime order p</text>
  <text x="150" y="192" text-anchor="middle" class="label-math">generator g&#x2081;</text>
  <text x="150" y="216" text-anchor="middle" class="label-math">CDH hard</text>
  <text x="150" y="238" text-anchor="middle" class="label-math">DDH easy (via e)</text>
  <text x="150" y="258" text-anchor="middle" font-size="11" fill="#3b82f6" font-family="Georgia, serif">&#x25CF; H(m) &#x2208; G&#x2081;*</text>

  <!-- G2 Box -->
  <rect x="320" y="90" width="220" height="180" rx="12" ry="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="430" y="118" text-anchor="middle" class="label-title">G&#x2082;</text>
  <text x="430" y="138" text-anchor="middle" class="section-label">Source Group 2</text>
  <line x1="340" y1="148" x2="520" y2="148" stroke="#334155" stroke-width="1"/>
  <text x="430" y="170" text-anchor="middle" class="label-math">prime order p</text>
  <text x="430" y="192" text-anchor="middle" class="label-math">generator g&#x2082;</text>
  <text x="430" y="216" text-anchor="middle" class="label-math">CDH hard</text>
  <text x="430" y="238" text-anchor="middle" class="label-math">DDH easy (via e)</text>
  <text x="430" y="258" text-anchor="middle" font-size="11" fill="#8b5cf6" font-family="Georgia, serif">&#x25CF; pk = g&#x2082;&#x02E3; &#x2208; G&#x2082;</text>

  <!-- GT Box -->
  <rect x="600" y="90" width="220" height="180" rx="12" ry="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="710" y="118" text-anchor="middle" class="label-title">G&#x1D54B;</text>
  <text x="710" y="138" text-anchor="middle" class="section-label">Target Group</text>
  <line x1="620" y1="148" x2="820" y2="148" stroke="#334155" stroke-width="1"/>
  <text x="710" y="170" text-anchor="middle" class="label-math">prime order p</text>
  <text x="710" y="192" text-anchor="middle" class="label-math">e(g&#x2081;, g&#x2082;) generates G&#x1D54B;</text>
  <text x="710" y="216" text-anchor="middle" class="label-math">multiplicative group</text>
  <text x="710" y="238" text-anchor="middle" class="label-math">DDH easy</text>
  <text x="710" y="258" text-anchor="middle" font-size="11" fill="#10b981" font-family="Georgia, serif">&#x25CF; verification target</text>

  <!-- Arrow G1 x G2 -> GT -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Curved arrow from G1 to GT passing through middle -->
  <path d="M 260 180 Q 430 100 600 180" stroke="#fbbf24" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>
  <text x="430" y="132" text-anchor="middle" class="arrow-label">e(&#183;, &#183;)</text>
  <text x="430" y="148" text-anchor="middle" font-size="11" fill="#fbbf24" font-family="Georgia, serif">bilinear pairing</text>

  <!-- Blind BLS signing flow -->
  <rect x="40" y="300" width="780" height="96" rx="10" ry="10" fill="#0d1520" stroke="#334155" stroke-width="1.5"/>
  <text x="430" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#e2e8f0" font-family="Georgia, serif">Blind BLS Protocol</text>
  <line x1="60" y1="330" x2="820" y2="330" stroke="#334155" stroke-width="1"/>

  <!-- Protocol steps inline -->
  <text x="100" y="352" text-anchor="middle" font-size="11.5" fill="#3b82f6" font-family="Georgia, serif">User</text>
  <text x="100" y="370" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="Georgia, serif">pick &#946; &#x2208; Z*_p</text>
  <text x="100" y="386" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="Georgia, serif">send H(m)&#x1D6C3; &#x2208; G&#x2081;</text>

  <text x="310" y="362" text-anchor="middle" font-size="11" fill="#fbbf24" font-family="Georgia, serif">&#x27F6; H(m)&#x1D6C3; &#x27F6;</text>

  <text x="490" y="352" text-anchor="middle" font-size="11.5" fill="#8b5cf6" font-family="Georgia, serif">Signer (sk = x)</text>
  <text x="490" y="370" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="Georgia, serif">&#x03C3;&#x0302; = H(m)&#x1D6C3;&#x02E3; &#x2208; G&#x2081;</text>

  <text x="660" y="362" text-anchor="middle" font-size="11" fill="#fbbf24" font-family="Georgia, serif">&#x27F5; &#x03C3;&#x0302; &#x27F5;</text>

  <text x="790" y="352" text-anchor="middle" font-size="11.5" fill="#10b981" font-family="Georgia, serif">User</text>
  <text x="790" y="370" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="Georgia, serif">&#x03C3; = &#x03C3;&#x0302;&#x1D6C3;&#x207B;&#xB9; = H(m)&#x02E3;</text>
  <text x="790" y="386" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="Georgia, serif">verify: e(&#x03C3;, g&#x2082;) = e(H(m), pk)</text>

</svg>
</body>
</html>
