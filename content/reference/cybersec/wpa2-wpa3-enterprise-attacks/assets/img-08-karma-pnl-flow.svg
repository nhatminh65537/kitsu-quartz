<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">KARMA Attack — PNL Exploitation Flow</text>

  <!-- Client device -->
  <rect x="50" y="60" width="150" height="70" rx="6" ry="6" fill="#61afef" stroke="#4090cf" stroke-width="1.5"/>
  <text x="125" y="85" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Client Device</text>
  <text x="125" y="103" text-anchor="middle" font-size="10" fill="#cce5ff">Preferred Network List (PNL):</text>
  <text x="125" y="118" text-anchor="middle" font-size="10" fill="#cce5ff">"CorpWifi", "Starbucks"...</text>

  <!-- Probe Request arrow -->
  <line x1="202" y1="95" x2="348" y2="95" stroke="#61afef" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275" y="83" text-anchor="middle" font-size="10" fill="#61afef">Probe Request</text>
  <text x="275" y="108" text-anchor="middle" font-size="10" fill="#888">"Do you know CorpWifi?"</text>

  <!-- KARMA AP -->
  <rect x="350" y="60" width="160" height="70" rx="6" ry="6" fill="#e06c75" stroke="#c0515f" stroke-width="1.5"/>
  <text x="430" y="85" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">KARMA AP</text>
  <text x="430" y="103" text-anchor="middle" font-size="10" fill="#fff">(eaphammer / hostapd-wpe)</text>
  <text x="430" y="118" text-anchor="middle" font-size="10" fill="#ffd0d0">Responds to ANY probe</text>

  <!-- Probe Response arrow -->
  <line x1="350" y1="118" x2="204" y2="118" stroke="#e06c75" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="277" y="133" text-anchor="middle" font-size="10" fill="#e06c75">"Yes! I am CorpWifi!"</text>

  <!-- Connect arrow -->
  <line x1="202" y1="148" x2="348" y2="148" stroke="#61afef" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275" y="163" text-anchor="middle" font-size="10" fill="#61afef">Connect (EAP auth begins)</text>

  <!-- Fake RADIUS -->
  <rect x="560" y="60" width="180" height="70" rx="6" ry="6" fill="#c678dd" stroke="#a558bd" stroke-width="1.5"/>
  <text x="650" y="85" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Fake RADIUS</text>
  <text x="650" y="103" text-anchor="middle" font-size="10" fill="#e8d0f8">EAP credential harvest</text>
  <text x="650" y="118" text-anchor="middle" font-size="10" fill="#e8d0f8">MSCHAPv2 / GTC / PAP</text>

  <!-- KARMA AP to RADIUS arrow -->
  <line x1="512" y1="95" x2="558" y2="95" stroke="#e06c75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PNL Detail box -->
  <rect x="30" y="195" width="360" height="130" rx="6" ry="6" fill="#1e2127" stroke="#61afef" stroke-width="1"/>
  <text x="210" y="215" text-anchor="middle" font-size="12" fill="#61afef" font-weight="bold">Tại sao KARMA hoạt động?</text>
  <text x="50" y="233" font-size="11" fill="#abb2bf">• 802.11 cho phép station broadcast probe requests</text>
  <text x="50" y="251" font-size="11" fill="#abb2bf">  cho tất cả networks trong PNL (Preferred Network List)</text>
  <text x="50" y="269" font-size="11" fill="#abb2bf">• AP không cần "chứng minh" identity trước khi client</text>
  <text x="50" y="287" font-size="11" fill="#abb2bf">  bắt đầu kết nối — trust dựa vào SSID match</text>
  <text x="50" y="305" font-size="11" fill="#e06c75">• Client tự động kết nối với bất kỳ AP nào broadcast</text>
  <text x="50" y="321" font-size="11" fill="#e06c75">  đúng SSID trong PNL của họ</text>

  <!-- Known Beacons box -->
  <rect x="410" y="195" width="360" height="130" rx="6" ry="6" fill="#1e2127" stroke="#e5c07b" stroke-width="1"/>
  <text x="590" y="215" text-anchor="middle" font-size="12" fill="#e5c07b" font-weight="bold">Known Beacons (KARMA variant)</text>
  <text x="430" y="233" font-size="11" fill="#abb2bf">• AP broadcast beacon frames với SSID phổ biến</text>
  <text x="430" y="251" font-size="11" fill="#abb2bf">  ("Starbucks", "attwifi", "CorpWifi", "eduroam"...)</text>
  <text x="430" y="269" font-size="11" fill="#abb2bf">• Không cần probe request — AP chủ động quảng bá</text>
  <text x="430" y="287" font-size="11" fill="#e5c07b">• Hiệu quả hơn KARMA trong môi trường có nhiều</text>
  <text x="430" y="305" font-size="11" fill="#e5c07b">  clients đang tìm kiếm network cũ</text>
  <text x="430" y="321" font-size="11" fill="#888">eaphammer --known-beacons --known-ssids-file ssids.txt</text>

  <!-- Command Box -->
  <rect x="30" y="345" width="740" height="60" rx="6" ry="6" fill="#1e2127" stroke="#e06c75" stroke-width="1"/>
  <text x="400" y="363" text-anchor="middle" font-size="11" fill="#e5c07b" font-weight="bold">Commands — KARMA + Enterprise credential harvest</text>
  <text x="400" y="381" text-anchor="middle" font-size="11" fill="#e06c75">eaphammer -i wlan0 --channel 6 --auth wpa-eap --essid CorpWifi --creds --karma</text>
  <text x="400" y="397" text-anchor="middle" font-size="11" fill="#888">eaphammer -i wlan0 --known-beacons --known-ssids-file /usr/share/eaphammer/wordlists/known_ssids.txt --creds</text>
</svg>
