<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98c379"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e5c07b"/>
    </marker>
  </defs>

  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">WPA-Enterprise Evil Twin — EAP Credential Capture Flow</text>

  <!-- ENTITIES -->
  <!-- Victim -->
  <rect x="30" y="48" width="130" height="50" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="95" y="68" text-anchor="middle" font-size="12" fill="#abb2bf">Victim Client</text>
  <text x="95" y="84" text-anchor="middle" font-size="10" fill="#abb2bf">EAP Supplicant</text>
  <text x="95" y="97" text-anchor="middle" font-size="10" fill="#abb2bf">(Windows/Mac/Linux)</text>

  <!-- Rogue AP -->
  <rect x="310" y="48" width="180" height="50" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="400" y="68" text-anchor="middle" font-size="12" fill="#ffffff">Rogue AP + Fake RADIUS</text>
  <text x="400" y="84" text-anchor="middle" font-size="10" fill="#ffffff">hostapd-wpe / EAPHammer</text>
  <text x="400" y="97" text-anchor="middle" font-size="10" fill="#ffffff">Fake cert (same CN as real)</text>

  <!-- Real RADIUS (faded) -->
  <rect x="620" y="48" width="150" height="50" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b" opacity="0.4"/>
  <text x="695" y="68" text-anchor="middle" font-size="12" fill="#abb2bf" opacity="0.5">Real RADIUS</text>
  <text x="695" y="84" text-anchor="middle" font-size="10" fill="#abb2bf" opacity="0.5">Server (bypassed)</text>
  <text x="695" y="97" text-anchor="middle" font-size="10" fill="#e06c75">✗ Not involved</text>

  <!-- === NORMAL PEAP FLOW (Left side annotation) === -->
  <text x="10" y="128" font-size="11" fill="#61afef" font-weight="bold">PEAP/TTLS Attack Flow (EAP-MSchapv2):</text>

  <!-- Step 1 -->
  <rect x="30" y="140" width="80" height="24" rx="3" ry="3" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="70" y="156" text-anchor="middle" font-size="9" fill="#abb2bf">① EAP-Start</text>
  <line x1="160" y1="152" x2="308" y2="152" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="147" text-anchor="middle" font-size="9" fill="#abb2bf">EAP-Request/Identity</text>

  <!-- Step 2 -->
  <rect x="30" y="178" width="100" height="24" rx="3" ry="3" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="80" y="194" text-anchor="middle" font-size="9" fill="#abb2bf">② Send Identity</text>
  <line x1="160" y1="190" x2="308" y2="190" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="185" text-anchor="middle" font-size="9" fill="#abb2bf">EAP-Response/Identity</text>
  <text x="235" y="198" text-anchor="middle" font-size="9" fill="#abb2bf">(username in clear)</text>

  <!-- Step 3: TLS Tunnel -->
  <rect x="310" y="215" width="180" height="30" rx="3" ry="3" fill="#e06c75" stroke="#c0515f"/>
  <text x="400" y="235" text-anchor="middle" font-size="10" fill="#ffffff">③ TLS Handshake — Rogue sends FAKE cert</text>

  <!-- Client checks cert (critical point) -->
  <rect x="30" y="260" width="270" height="44" rx="4" ry="4" fill="#e5c07b" stroke="#c5a05b"/>
  <text x="165" y="278" text-anchor="middle" font-size="10" fill="#1e2127" font-weight="bold">⚠️ Certificate Validation (critical!)</text>
  <text x="165" y="293" text-anchor="middle" font-size="10" fill="#1e2127">Client must check if cert is valid/trusted</text>
  <text x="165" y="306" text-anchor="middle" font-size="10" fill="#1e2127">Misconfigured clients SKIP this → attack succeeds</text>

  <!-- TLS Tunnel established -->
  <rect x="10" y="322" width="490" height="26" rx="3" ry="3" fill="#4b5263" stroke="#61afef" stroke-dasharray="5,3"/>
  <text x="255" y="339" text-anchor="middle" font-size="10" fill="#61afef">④ TLS Tunnel established (encrypted channel)</text>

  <!-- Step 4: Inner auth -->
  <line x1="160" y1="364" x2="308" y2="364" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="358" text-anchor="middle" font-size="9" fill="#abb2bf">⑤ Inner EAP Identity (real username)</text>

  <!-- Step 5: MSCHAPv2 challenge -->
  <line x1="308" y1="380" x2="160" y2="380" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="235" y="376" text-anchor="middle" font-size="9" fill="#e06c75">⑥ MSCHAPv2 Challenge</text>

  <!-- Step 6: MSCHAPv2 response (captured!) -->
  <line x1="160" y1="396" x2="308" y2="396" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="235" y="392" text-anchor="middle" font-size="9" fill="#e06c75">⑦ MSCHAPv2 Response (NTHash!)</text>

  <!-- CAPTURED! -->
  <rect x="310" y="412" width="370" height="54" rx="4" ry="4" fill="#e06c75" stroke="#c0515f"/>
  <text x="495" y="432" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">⑧ CAPTURED: NETNTLM Hash</text>
  <text x="495" y="448" text-anchor="middle" font-size="10" fill="#ffffff">username::domain:challenge:response</text>
  <text x="495" y="462" text-anchor="middle" font-size="10" fill="#ffffff">→ Crack with hashcat -m 5500 (NTLMv1) / -m 5600 (NTLMv2)</text>

  <!-- Offline crack flow -->
  <rect x="310" y="475" width="180" height="36" rx="4" ry="4" fill="#98c379" stroke="#78a359"/>
  <text x="400" y="491" text-anchor="middle" font-size="10" fill="#1e2127" font-weight="bold">Offline crack → plaintext</text>
  <text x="400" y="504" text-anchor="middle" font-size="10" fill="#1e2127">hashcat -m 5600 hash.txt rockyou.txt</text>

  <!-- EAP Downgrade box -->
  <rect x="570" y="340" width="210" height="100" rx="4" ry="4" fill="#4b5263" stroke="#c678dd" stroke-dasharray="4,2"/>
  <text x="675" y="358" text-anchor="middle" font-size="10" fill="#c678dd">EAP Downgrade Attack</text>
  <text x="675" y="374" text-anchor="middle" font-size="10" fill="#abb2bf">Force client from PEAP</text>
  <text x="675" y="388" text-anchor="middle" font-size="10" fill="#abb2bf">to weaker EAP-GTC/PAP</text>
  <text x="675" y="402" text-anchor="middle" font-size="10" fill="#abb2bf">→ cleartext password!</text>
  <text x="675" y="416" text-anchor="middle" font-size="10" fill="#c678dd">hostapd.eap_user config</text>
  <text x="675" y="430" text-anchor="middle" font-size="10" fill="#c678dd">EAPHammer --negotiate</text>
</svg>
