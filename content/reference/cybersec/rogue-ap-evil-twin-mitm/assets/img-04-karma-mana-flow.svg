<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e5c07b"/>
    </marker>
  </defs>

  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">KARMA vs MANA Attack — PNL Exploitation Flow</text>

  <!-- COLUMN HEADERS -->
  <text x="130" y="52" text-anchor="middle" font-size="11" fill="#61afef" font-weight="bold">Device A</text>
  <text x="400" y="52" text-anchor="middle" font-size="11" fill="#e06c75" font-weight="bold">Rogue AP (EAPHammer / hostapd-mana)</text>
  <text x="670" y="52" text-anchor="middle" font-size="11" fill="#61afef" font-weight="bold">Device B</text>

  <!-- Divider lines -->
  <line x1="260" y1="40" x2="260" y2="480" stroke="#3a3f4b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="540" y1="40" x2="540" y2="480" stroke="#3a3f4b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Device A PNL -->
  <rect x="30" y="60" width="200" height="84" rx="4" ry="4" fill="#4b5263" stroke="#61afef" stroke-dasharray="4,2"/>
  <text x="130" y="76" text-anchor="middle" font-size="10" fill="#61afef">PNL of Device A</text>
  <text x="130" y="92" text-anchor="middle" font-size="10" fill="#abb2bf">• Corp-WiFi</text>
  <text x="130" y="106" text-anchor="middle" font-size="10" fill="#abb2bf">• HomeNet</text>
  <text x="130" y="120" text-anchor="middle" font-size="10" fill="#abb2bf">• Starbucks</text>
  <text x="130" y="136" text-anchor="middle" font-size="10" fill="#abb2bf">• Airport-Free</text>

  <!-- Device B PNL -->
  <rect x="570" y="60" width="200" height="84" rx="4" ry="4" fill="#4b5263" stroke="#61afef" stroke-dasharray="4,2"/>
  <text x="670" y="76" text-anchor="middle" font-size="10" fill="#61afef">PNL of Device B</text>
  <text x="670" y="92" text-anchor="middle" font-size="10" fill="#abb2bf">• Hotel-WiFi</text>
  <text x="670" y="106" text-anchor="middle" font-size="10" fill="#abb2bf">• Corp-WiFi</text>
  <text x="670" y="120" text-anchor="middle" font-size="10" fill="#abb2bf">• Attwifi</text>
  <text x="670" y="136" text-anchor="middle" font-size="10" fill="#abb2bf">• xfinitywifi</text>

  <!-- Rogue AP box -->
  <rect x="285" y="60" width="230" height="84" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="400" y="78" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">Rogue AP</text>
  <text x="400" y="94" text-anchor="middle" font-size="10" fill="#ffffff">hostapd-mana / EAPHammer</text>
  <text x="400" y="110" text-anchor="middle" font-size="10" fill="#ffffff">Reconstructed PNL DB:</text>
  <text x="400" y="124" text-anchor="middle" font-size="10" fill="#ffffff">Corp-WiFi, HomeNet, Hotel-WiFi...</text>
  <text x="400" y="138" text-anchor="middle" font-size="10" fill="#ffffff">(union of all observed PNLs)</text>

  <!-- === KARMA ATTACK === -->
  <text x="130" y="170" text-anchor="middle" font-size="11" fill="#e5c07b" font-weight="bold">KARMA Attack (legacy)</text>

  <!-- Device A directed probe -->
  <line x1="232" y1="190" x2="283" y2="190" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="155" y="186" font-size="10" fill="#abb2bf">Directed Probe Req</text>
  <text x="155" y="198" font-size="10" fill="#abb2bf">SSID="Corp-WiFi"</text>

  <!-- Rogue AP responds to ALL probes (Karma) -->
  <line x1="285" y1="200" x2="233" y2="200" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="283" y="215" text-anchor="end" font-size="10" fill="#e06c75">Responds to ANY SSID</text>
  <text x="283" y="227" text-anchor="end" font-size="10" fill="#e5c07b">⚠️ Also responds to Device B</text>

  <!-- Device B -->
  <line x1="568" y1="190" x2="517" y2="190" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="650" y="186" font-size="10" fill="#abb2bf">Probe Req</text>
  <text x="650" y="198" font-size="10" fill="#abb2bf">SSID="Hotel-WiFi"</text>
  <line x1="517" y1="200" x2="569" y2="200" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="515" y="215" font-size="10" fill="#e06c75">Responds: "I am Hotel-WiFi"</text>

  <!-- Divider -->
  <line x1="20" y1="248" x2="780" y2="248" stroke="#4b5263" stroke-width="1.5"/>

  <!-- === MANA ATTACK === -->
  <text x="130" y="268" text-anchor="middle" font-size="11" fill="#98c379" font-weight="bold">MANA Attack (modern — smarter)</text>

  <!-- Broadcast probe from A -->
  <line x1="232" y1="290" x2="283" y2="290" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="155" y="286" font-size="10" fill="#abb2bf">Broadcast Probe</text>
  <text x="155" y="298" font-size="10" fill="#abb2bf">SSID=NULL (any)</text>

  <!-- MANA reconstructs PNL -->
  <rect x="285" y="275" width="230" height="54" rx="4" ry="4" fill="#4b5263" stroke="#98c379" stroke-dasharray="4,2"/>
  <text x="400" y="293" text-anchor="middle" font-size="10" fill="#98c379">MANA: lookup Device A's PNL</text>
  <text x="400" y="307" text-anchor="middle" font-size="10" fill="#abb2bf">Responds with Corp-WiFi, HomeNet,</text>
  <text x="400" y="321" text-anchor="middle" font-size="10" fill="#abb2bf">Starbucks, Airport-Free separately</text>

  <!-- Multiple responses -->
  <line x1="285" y1="320" x2="233" y2="310" stroke="#98c379" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <text x="130" y="335" text-anchor="middle" font-size="10" fill="#98c379">Directed response per SSID</text>
  <text x="130" y="347" text-anchor="middle" font-size="10" fill="#98c379">→ Client auto-connects ✓</text>

  <!-- LOUD mode -->
  <rect x="285" y="360" width="230" height="60" rx="4" ry="4" fill="#4b5263" stroke="#e5c07b" stroke-dasharray="4,2"/>
  <text x="400" y="378" text-anchor="middle" font-size="10" fill="#e5c07b">LOUD Mode (--loud flag)</text>
  <text x="400" y="392" text-anchor="middle" font-size="10" fill="#abb2bf">Broadcasts UNION of ALL PNLs</text>
  <text x="400" y="406" text-anchor="middle" font-size="10" fill="#abb2bf">Corp-WiFi+HomeNet+Hotel-WiFi...</text>
  <text x="400" y="420" text-anchor="middle" font-size="10" fill="#abb2bf">→ Exploits OTHER device's bad probing</text>

  <!-- Device A connects (MANA) -->
  <line x1="232" y1="355" x2="283" y2="380" stroke="#e5c07b" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <text x="130" y="380" text-anchor="middle" font-size="10" fill="#e5c07b">Device A connected</text>
  <text x="130" y="392" text-anchor="middle" font-size="10" fill="#e5c07b">to Rogue AP ✓</text>

  <!-- Known Beacon Attack -->
  <rect x="570" y="360" width="200" height="60" rx="4" ry="4" fill="#4b5263" stroke="#c678dd" stroke-dasharray="4,2"/>
  <text x="670" y="378" text-anchor="middle" font-size="10" fill="#c678dd">Known Beacon Attack</text>
  <text x="670" y="392" text-anchor="middle" font-size="10" fill="#abb2bf">Brute-forces common SSIDs</text>
  <text x="670" y="406" text-anchor="middle" font-size="10" fill="#abb2bf">from wordlist (no probe needed)</text>
  <text x="670" y="420" text-anchor="middle" font-size="10" fill="#c678dd">--known-beacons flag</text>

  <!-- Footer -->
  <rect x="10" y="445" width="780" height="46" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="20" y="463" font-size="10" fill="#abb2bf" font-weight="bold">Evolution:</text>
  <text x="75" y="463" font-size="10" fill="#e5c07b">KARMA (2004)</text>
  <text x="150" y="463" font-size="10" fill="#abb2bf">→ responds to ALL directed probes (blocked by modern OS)</text>
  <text x="20" y="480" font-size="10" fill="#abb2bf">MANA (2015) → reconstructs PNL per device, responds only to matching broadcast probes (bypasses OS protection)</text>
</svg>
