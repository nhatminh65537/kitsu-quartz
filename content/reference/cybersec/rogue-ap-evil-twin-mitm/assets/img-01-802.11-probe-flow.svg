<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98c379"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e5c07b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">802.11 Probe Mechanism &amp; Rogue AP Connection Flow</text>

  <!-- === SECTION A: NORMAL FLOW === -->
  <text x="10" y="58" font-size="12" fill="#61afef" font-weight="bold">A) Normal Connection Flow</text>

  <!-- Client -->
  <rect x="30" y="68" width="120" height="44" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#abb2bf">Client Device</text>
  <text x="90" y="103" text-anchor="middle" font-size="10" fill="#abb2bf">(Laptop/Phone)</text>

  <!-- Legit AP -->
  <rect x="320" y="68" width="120" height="44" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="380" y="88" text-anchor="middle" font-size="12" fill="#ffffff">Legitimate AP</text>
  <text x="380" y="103" text-anchor="middle" font-size="10" fill="#ffffff">SSID: "Corp-WiFi"</text>

  <!-- PNL box -->
  <rect x="30" y="125" width="120" height="64" rx="4" ry="4" fill="#4b5263" stroke="#61afef" stroke-dasharray="4,3"/>
  <text x="90" y="141" text-anchor="middle" font-size="10" fill="#61afef">PNL (Preferred</text>
  <text x="90" y="154" text-anchor="middle" font-size="10" fill="#61afef">Network List)</text>
  <text x="90" y="167" text-anchor="middle" font-size="10" fill="#abb2bf">Corp-WiFi</text>
  <text x="90" y="180" text-anchor="middle" font-size="10" fill="#abb2bf">HomeNet</text>

  <!-- Step 1: Beacon -->
  <line x1="320" y1="92" x2="155" y2="92" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="82" text-anchor="middle" font-size="10" fill="#abb2bf">① Beacon Frame</text>
  <text x="235" y="95" text-anchor="middle" font-size="10" fill="#abb2bf">(SSID broadcast)</text>

  <!-- Step 2: Probe Request (directed) -->
  <line x1="155" y1="145" x2="318" y2="108" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="132" text-anchor="middle" font-size="10" fill="#abb2bf">② Directed Probe Req</text>
  <text x="220" y="144" text-anchor="middle" font-size="10" fill="#abb2bf">SSID="Corp-WiFi"</text>

  <!-- Step 3: Probe Response -->
  <line x1="320" y1="120" x2="160" y2="155" stroke="#98c379" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="265" y="160" text-anchor="middle" font-size="10" fill="#98c379">③ Probe Response</text>

  <!-- Step 4: Association -->
  <line x1="155" y1="180" x2="318" y2="168" stroke="#98c379" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="240" y="186" text-anchor="middle" font-size="10" fill="#98c379">④ Auth + Associate</text>

  <!-- === DIVIDER === -->
  <line x1="10" y1="220" x2="790" y2="220" stroke="#4b5263" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- === SECTION B: EVIL TWIN ATTACK === -->
  <text x="10" y="244" font-size="12" fill="#e06c75" font-weight="bold">B) Evil Twin Attack Flow</text>

  <!-- Client 2 -->
  <rect x="30" y="256" width="120" height="44" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="90" y="276" text-anchor="middle" font-size="12" fill="#abb2bf">Client Device</text>
  <text x="90" y="291" text-anchor="middle" font-size="10" fill="#abb2bf">(Victim)</text>

  <!-- Legit AP 2 (faded) -->
  <rect x="300" y="256" width="130" height="44" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b" opacity="0.5"/>
  <text x="365" y="276" text-anchor="middle" font-size="12" fill="#abb2bf" opacity="0.5">Legitimate AP</text>
  <text x="365" y="291" text-anchor="middle" font-size="10" fill="#abb2bf" opacity="0.5">SSID: "Corp-WiFi"</text>

  <!-- Rogue AP -->
  <rect x="590" y="256" width="140" height="44" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="660" y="276" text-anchor="middle" font-size="12" fill="#ffffff">Rogue AP</text>
  <text x="660" y="291" text-anchor="middle" font-size="10" fill="#ffffff">SSID: "Corp-WiFi" 📡</text>

  <!-- Attacker -->
  <rect x="590" y="370" width="140" height="44" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="660" y="390" text-anchor="middle" font-size="12" fill="#ffffff">Attacker</text>
  <text x="660" y="405" text-anchor="middle" font-size="10" fill="#ffffff">(Controls Rogue AP)</text>

  <!-- Step 1: Deauth -->
  <line x1="590" y1="278" x2="433" y2="278" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="510" y="268" text-anchor="middle" font-size="10" fill="#e06c75" font-weight="bold">① Deauth Flood</text>
  <text x="510" y="280" text-anchor="middle" font-size="10" fill="#e06c75">aireplay-ng --deauth</text>

  <!-- Client disconnects -->
  <text x="90" y="320" text-anchor="middle" font-size="10" fill="#e5c07b">Client disconnected</text>
  <text x="90" y="333" text-anchor="middle" font-size="10" fill="#e5c07b">scanning for AP...</text>

  <!-- Step 2: Probe + stronger signal -->
  <line x1="155" y1="330" x2="588" y2="278" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="318" text-anchor="middle" font-size="10" fill="#abb2bf">② Probe Request</text>
  <text x="360" y="330" text-anchor="middle" font-size="10" fill="#abb2bf">SSID="Corp-WiFi"</text>

  <!-- Step 3: Stronger probe response -->
  <line x1="590" y1="292" x2="158" y2="338" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="400" y="355" text-anchor="middle" font-size="10" fill="#e06c75">③ Probe Response (stronger signal)</text>

  <!-- Step 4: Client connects to rogue -->
  <line x1="155" y1="355" x2="588" y2="305" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="370" y="378" text-anchor="middle" font-size="10" fill="#e5c07b">④ Client associates with Rogue AP ⚠️</text>

  <!-- Rogue AP to Attacker -->
  <line x1="660" y1="300" x2="660" y2="368" stroke="#e06c75" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="695" y="340" font-size="10" fill="#e06c75">Traffic</text>
  <text x="695" y="352" font-size="10" fill="#e06c75">intercepted</text>

  <!-- Legend -->
  <rect x="10" y="448" width="780" height="62" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="20" y="466" font-size="11" fill="#abb2bf" font-weight="bold">Legend:</text>
  <rect x="70" y="456" width="12" height="12" fill="#61afef"/>
  <text x="86" y="466" font-size="10" fill="#abb2bf">Legitimate AP</text>
  <rect x="175" y="456" width="12" height="12" fill="#e06c75"/>
  <text x="191" y="466" font-size="10" fill="#abb2bf">Attacker / Rogue AP</text>
  <rect x="305" y="456" width="12" height="12" fill="#98c379"/>
  <text x="321" y="466" font-size="10" fill="#abb2bf">Normal flow (success)</text>
  <rect x="440" y="456" width="12" height="12" fill="#4b5263" stroke="#61afef" stroke-dasharray="3,2"/>
  <text x="456" y="466" font-size="10" fill="#abb2bf">PNL (stored networks)</text>
  <text x="20" y="500" font-size="10" fill="#abb2bf">Key insight: 802.11 standard does NOT require AP authentication to client — client trusts SSID alone.</text>
  <text x="20" y="512" font-size="10" fill="#abb2bf">Rogue AP exploits this by broadcasting same SSID with stronger signal or forced deauth.</text>
</svg>
