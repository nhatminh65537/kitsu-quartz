<svg viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">WPA2 Key Derivation Hierarchy</text>

  <!-- ===== PAIRWISE SIDE ===== -->
  <!-- Passphrase -->
  <rect x="60" y="48" width="160" height="44" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="140" y="66" text-anchor="middle" font-size="12" fill="#fff">Passphrase (ASCII)</text>
  <text x="140" y="82" text-anchor="middle" font-size="10" fill="#fff">8–63 chars</text>

  <!-- SSID input -->
  <rect x="260" y="48" width="120" height="44" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="320" y="66" text-anchor="middle" font-size="11" fill="#abb2bf">SSID</text>
  <text x="320" y="82" text-anchor="middle" font-size="10" fill="#e5c07b">(used as salt)</text>

  <!-- Arrow to PBKDF2 -->
  <line x1="220" y1="70" x2="290" y2="70" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="70" x2="255" y2="120" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="92" x2="140" y2="120" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PBKDF2 -->
  <rect x="75" y="122" width="265" height="52" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="207" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">PBKDF2(HMAC-SHA1, pass, SSID, 4096, 256)</text>
  <text x="207" y="162" text-anchor="middle" font-size="10" fill="#fff">Password-Based Key Derivation Function 2 — 4096 iterations</text>

  <!-- PMK -->
  <line x1="207" y1="174" x2="207" y2="204" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="100" y="206" width="215" height="52" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="207" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">PMK — Pairwise Master Key</text>
  <text x="207" y="244" text-anchor="middle" font-size="10" fill="#fff">256 bits · valid entire session</text>

  <!-- PRF-512 inputs -->
  <!-- ANonce, SNonce, AA, SPA -->
  <rect x="430" y="148" width="140" height="100" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="500" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#e5c07b">PRF-512 Inputs</text>
  <text x="500" y="186" text-anchor="middle" font-size="10" fill="#abb2bf">ANonce (AP random)</text>
  <text x="500" y="202" text-anchor="middle" font-size="10" fill="#abb2bf">SNonce (STA random)</text>
  <text x="500" y="218" text-anchor="middle" font-size="10" fill="#abb2bf">AA = AP MAC addr</text>
  <text x="500" y="234" text-anchor="middle" font-size="10" fill="#abb2bf">SPA = STA MAC addr</text>

  <!-- Arrow from PMK to PRF -->
  <line x1="315" y1="232" x2="420" y2="210" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="210" x2="415" y2="280" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PRF-512 box -->
  <rect x="100" y="278" width="310" height="52" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="255" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">PRF-512(PMK, "Pairwise key expansion",</text>
  <text x="255" y="316" text-anchor="middle" font-size="11" fill="#fff">Min(AA,SPA) ‖ Max(AA,SPA) ‖ Min(AN,SN) ‖ Max(AN,SN))</text>

  <!-- PTK arrow -->
  <line x1="255" y1="330" x2="255" y2="358" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PTK block -->
  <rect x="30" y="360" width="565" height="68" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="312" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">PTK — Pairwise Transient Key (384 bits for CCMP-128)</text>

  <!-- PTK sub-fields -->
  <rect x="38" y="388" width="100" height="32" rx="4" ry="4" fill="#1e2127" stroke="#4090cf"/>
  <text x="88" y="402" text-anchor="middle" font-size="10" fill="#61afef">KCK</text>
  <text x="88" y="416" text-anchor="middle" font-size="9" fill="#abb2bf">128b · MIC key</text>

  <rect x="144" y="388" width="100" height="32" rx="4" ry="4" fill="#1e2127" stroke="#4090cf"/>
  <text x="194" y="402" text-anchor="middle" font-size="10" fill="#61afef">KEK</text>
  <text x="194" y="416" text-anchor="middle" font-size="9" fill="#abb2bf">128b · encrypt GTK</text>

  <rect x="250" y="388" width="100" height="32" rx="4" ry="4" fill="#1e2127" stroke="#4090cf"/>
  <text x="300" y="402" text-anchor="middle" font-size="10" fill="#98c379">TK</text>
  <text x="300" y="416" text-anchor="middle" font-size="9" fill="#abb2bf">128b · data encrypt</text>

  <rect x="356" y="388" width="110" height="32" rx="4" ry="4" fill="#1e2127" stroke="#4090cf"/>
  <text x="411" y="402" text-anchor="middle" font-size="10" fill="#61afef">MIC Tx / Rx</text>
  <text x="411" y="416" text-anchor="middle" font-size="9" fill="#abb2bf">2×64b · frame integrity</text>

  <rect x="472" y="388" width="115" height="32" rx="4" ry="4" fill="#1e2127" stroke="#4090cf" stroke-dasharray="3,2"/>
  <text x="529" y="402" text-anchor="middle" font-size="10" fill="#4b5263">(TKIP extra)</text>
  <text x="529" y="416" text-anchor="middle" font-size="9" fill="#4b5263">+128b TKIP only</text>

  <!-- ===== GROUP SIDE ===== -->
  <text x="680" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#abb2bf">Group Key</text>
  <text x="680" y="76" text-anchor="middle" font-size="11" fill="#abb2bf">Hierarchy</text>

  <!-- GMK -->
  <rect x="615" y="90" width="135" height="50" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="682" y="110" text-anchor="middle" font-size="11" fill="#fff">GMK</text>
  <text x="682" y="126" text-anchor="middle" font-size="10" fill="#fff">Group Master Key (AP)</text>

  <!-- PRF-128 -->
  <line x1="682" y1="140" x2="682" y2="166" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="615" y="168" width="135" height="44" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="682" y="186" text-anchor="middle" font-size="11" fill="#fff">PRF-128</text>
  <text x="682" y="202" text-anchor="middle" font-size="10" fill="#fff">(GNonce, GMK)</text>

  <!-- GTK -->
  <line x1="682" y1="212" x2="682" y2="238" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="615" y="240" width="135" height="52" rx="6" ry="6" fill="#e5c07b" stroke="#c5a05b"/>
  <text x="682" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e2127">GTK</text>
  <text x="682" y="276" text-anchor="middle" font-size="10" fill="#1e2127">Group Temporal Key</text>
  <text x="682" y="290" text-anchor="middle" font-size="9" fill="#1e2127">128-bit · shared by all STAs</text>

  <!-- GTK purpose -->
  <line x1="682" y1="292" x2="682" y2="318" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="615" y="320" width="135" height="50" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="682" y="340" text-anchor="middle" font-size="11" fill="#abb2bf">Encrypts</text>
  <text x="682" y="356" text-anchor="middle" font-size="10" fill="#abb2bf">Multicast +</text>
  <text x="682" y="368" text-anchor="middle" font-size="10" fill="#abb2bf">Broadcast traffic</text>

  <!-- GTK sent via M3 -->
  <line x1="615" y1="266" x2="600" y2="266" stroke="#e5c07b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="574" y="264" text-anchor="end" font-size="9" fill="#e5c07b">→ sent in M3</text>
  <text x="574" y="276" text-anchor="end" font-size="9" fill="#e5c07b">(encrypted by KEK)</text>

  <!-- Attacker notes -->
  <rect x="30" y="450" width="740" height="72" rx="6" ry="6" fill="#1e2127" stroke="#e06c75"/>
  <text x="400" y="470" text-anchor="middle" font-size="12" font-weight="bold" fill="#e06c75">Attacker's Perspective</text>
  <text x="400" y="488" text-anchor="middle" font-size="10" fill="#abb2bf">WPA2-PSK: Passphrase → PMK là static. Capture handshake (ANonce+SNonce+MACs) → có đủ để brute-force PMK offline.</text>
  <text x="400" y="504" text-anchor="middle" font-size="10" fill="#abb2bf">PMKID = HMAC-SHA1(PMK, "PMK Name" ‖ AA ‖ SPA) → derivable từ EAPOL frame 1 mà không cần full handshake.</text>
  <text x="400" y="518" text-anchor="middle" font-size="10" fill="#abb2bf">Tất cả STA share cùng GTK → Hole196: authenticated insider có thể forge broadcast frames.</text>
</svg>
