<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">WEP Encryption Pipeline — RC4 + CRC-32</text>

  <!-- ===== TOP: Key Setup ===== -->
  <!-- IV Box -->
  <rect x="30" y="50" width="110" height="50" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="85" y="70" text-anchor="middle" font-size="12" fill="#fff">IV (24-bit)</text>
  <text x="85" y="87" text-anchor="middle" font-size="10" fill="#fff">Random per frame</text>

  <!-- Secret Key Box -->
  <rect x="30" y="115" width="110" height="50" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="85" y="135" text-anchor="middle" font-size="12" fill="#fff">Secret Key</text>
  <text x="85" y="152" text-anchor="middle" font-size="10" fill="#fff">40 or 104-bit</text>

  <!-- Concat arrow -->
  <line x1="140" y1="75" x2="195" y2="98" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="140" x2="195" y2="118" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Concat box -->
  <rect x="196" y="88" width="80" height="40" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="236" y="108" text-anchor="middle" font-size="11" fill="#abb2bf">IV ‖ Key</text>
  <text x="236" y="122" text-anchor="middle" font-size="9" fill="#e5c07b">(seed)</text>

  <!-- Arrow to RC4 KSA -->
  <line x1="276" y1="108" x2="330" y2="108" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RC4 KSA -->
  <rect x="331" y="80" width="110" height="56" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="386" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">RC4 KSA</text>
  <text x="386" y="116" text-anchor="middle" font-size="10" fill="#fff">Key Scheduling</text>
  <text x="386" y="130" text-anchor="middle" font-size="9" fill="#fff">Algorithm</text>

  <!-- Arrow to PRGA -->
  <line x1="441" y1="108" x2="495" y2="108" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RC4 PRGA -->
  <rect x="496" y="80" width="110" height="56" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="551" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">RC4 PRGA</text>
  <text x="551" y="116" text-anchor="middle" font-size="10" fill="#fff">Pseudo-Random</text>
  <text x="551" y="130" text-anchor="middle" font-size="9" fill="#fff">Generation</text>

  <!-- Keystream output -->
  <line x1="606" y1="108" x2="660" y2="108" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="661" y="80" width="110" height="56" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="716" y="104" text-anchor="middle" font-size="11" fill="#fff">Keystream</text>
  <text x="716" y="120" text-anchor="middle" font-size="10" fill="#fff">KS[0..n]</text>
  <text x="716" y="134" text-anchor="middle" font-size="9" fill="#fff">bytes</text>

  <!-- Divider -->
  <line x1="20" y1="160" x2="780" y2="160" stroke="#3a3f4b" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ===== BOTTOM: Encryption Pipeline ===== -->
  <text x="400" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#e5c07b">Encryption + Integrity</text>

  <!-- Plaintext -->
  <rect x="30" y="200" width="110" height="45" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="85" y="218" text-anchor="middle" font-size="11" fill="#abb2bf">Plaintext</text>
  <text x="85" y="234" text-anchor="middle" font-size="10" fill="#abb2bf">Frame Body</text>

  <!-- CRC-32 arrow -->
  <line x1="140" y1="222" x2="195" y2="222" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CRC-32 -->
  <rect x="196" y="198" width="100" height="50" rx="6" ry="6" fill="#e5c07b" stroke="#c5a05b"/>
  <text x="246" y="218" text-anchor="middle" font-size="11" fill="#1e2127">CRC-32</text>
  <text x="246" y="234" text-anchor="middle" font-size="10" fill="#1e2127">→ ICV (4B)</text>

  <!-- Concat plaintext + ICV -->
  <line x1="296" y1="222" x2="350" y2="222" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="351" y="198" width="120" height="50" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="411" y="218" text-anchor="middle" font-size="11" fill="#abb2bf">Plaintext ‖ ICV</text>
  <text x="411" y="234" text-anchor="middle" font-size="10" fill="#e5c07b">concatenated</text>

  <!-- XOR with keystream -->
  <line x1="716" y1="136" x2="716" y2="222" stroke="#61afef" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="716" y1="222" x2="540" y2="222" stroke="#61afef" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- XOR box -->
  <rect x="476" y="198" width="80" height="50" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="516" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">XOR</text>
  <text x="516" y="236" text-anchor="middle" font-size="10" fill="#fff">⊕</text>

  <line x1="471" y1="222" x2="420" y2="222" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Ciphertext -->
  <line x1="556" y1="222" x2="615" y2="222" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="616" y="198" width="100" height="50" rx="6" ry="6" fill="#98c379" stroke="#78a359"/>
  <text x="666" y="218" text-anchor="middle" font-size="11" fill="#1e2127">Ciphertext</text>
  <text x="666" y="234" text-anchor="middle" font-size="10" fill="#1e2127">= KS ⊕ (P‖ICV)</text>

  <!-- Final frame assembly -->
  <text x="400" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#e5c07b">Final WEP Frame (Wire Format)</text>

  <rect x="30" y="290" width="90" height="40" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="75" y="308" text-anchor="middle" font-size="10" fill="#abb2bf">802.11</text>
  <text x="75" y="322" text-anchor="middle" font-size="10" fill="#abb2bf">Header</text>

  <rect x="125" y="290" width="90" height="40" rx="4" ry="4" fill="#e06c75" stroke="#c0515f"/>
  <text x="170" y="308" text-anchor="middle" font-size="10" fill="#fff">IV (3B)</text>
  <text x="170" y="322" text-anchor="middle" font-size="9" fill="#fff">in cleartext!</text>

  <rect x="220" y="290" width="60" height="40" rx="4" ry="4" fill="#e06c75" stroke="#c0515f"/>
  <text x="250" y="308" text-anchor="middle" font-size="10" fill="#fff">Key</text>
  <text x="250" y="322" text-anchor="middle" font-size="9" fill="#fff">Index</text>

  <rect x="285" y="290" width="380" height="40" rx="4" ry="4" fill="#98c379" stroke="#78a359"/>
  <text x="475" y="315" text-anchor="middle" font-size="11" fill="#1e2127">Encrypted Data = Ciphertext (Frame Body + ICV)</text>

  <rect x="670" y="290" width="100" height="40" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="720" y="308" text-anchor="middle" font-size="10" fill="#abb2bf">FCS</text>
  <text x="720" y="322" text-anchor="middle" font-size="9" fill="#abb2bf">CRC (outer)</text>

  <!-- Vulnerabilities section -->
  <text x="400" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#e06c75">Critical Weaknesses</text>

  <rect x="30" y="376" width="220" height="64" rx="6" ry="6" fill="#2d1f1f" stroke="#e06c75"/>
  <text x="140" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#e06c75">IV Space Exhaustion</text>
  <text x="140" y="412" text-anchor="middle" font-size="10" fill="#abb2bf">Only 2²⁴ = 16M IVs</text>
  <text x="140" y="428" text-anchor="middle" font-size="10" fill="#abb2bf">Busy AP reuses in ~5 hours</text>
  <text x="140" y="440" text-anchor="middle" font-size="9" fill="#e06c75">→ keystream reuse attack</text>

  <rect x="290" y="376" width="220" height="64" rx="6" ry="6" fill="#2d1f1f" stroke="#e06c75"/>
  <text x="400" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#e06c75">CRC-32 Linearity</text>
  <text x="400" y="412" text-anchor="middle" font-size="10" fill="#abb2bf">CRC-32 is linear function</text>
  <text x="400" y="428" text-anchor="middle" font-size="10" fill="#abb2bf">Bit flip in CT → predictable ICV</text>
  <text x="400" y="440" text-anchor="middle" font-size="9" fill="#e06c75">→ forgery without key</text>

  <rect x="550" y="376" width="220" height="64" rx="6" ry="6" fill="#2d1f1f" stroke="#e06c75"/>
  <text x="660" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#e06c75">FMS Weak IVs</text>
  <text x="660" y="412" text-anchor="middle" font-size="10" fill="#abb2bf">Specific IV patterns leak</text>
  <text x="660" y="428" text-anchor="middle" font-size="10" fill="#abb2bf">key bytes statistically</text>
  <text x="660" y="440" text-anchor="middle" font-size="9" fill="#e06c75">→ key recovery in &lt;5min</text>
</svg>
