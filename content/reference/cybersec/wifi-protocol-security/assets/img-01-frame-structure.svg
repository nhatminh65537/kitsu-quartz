<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">802.11 MAC Frame — General Structure</text>

  <!-- Frame Control (FC) block -->
  <rect x="20" y="50" width="80" height="50" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="60" y="70" text-anchor="middle" font-size="11" fill="#abb2bf">Frame</text>
  <text x="60" y="84" text-anchor="middle" font-size="11" fill="#abb2bf">Control</text>
  <text x="60" y="98" text-anchor="middle" font-size="9" fill="#e5c07b">2 bytes</text>

  <!-- Duration -->
  <rect x="105" y="50" width="60" height="50" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="135" y="70" text-anchor="middle" font-size="11" fill="#abb2bf">Duration</text>
  <text x="135" y="84" text-anchor="middle" font-size="11" fill="#abb2bf">/ID</text>
  <text x="135" y="98" text-anchor="middle" font-size="9" fill="#e5c07b">2 bytes</text>

  <!-- Addr 1 -->
  <rect x="170" y="50" width="80" height="50" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="210" y="70" text-anchor="middle" font-size="11" fill="#ffffff">Address 1</text>
  <text x="210" y="84" text-anchor="middle" font-size="10" fill="#ffffff">DA / RA</text>
  <text x="210" y="98" text-anchor="middle" font-size="9" fill="#ffffff">6 bytes</text>

  <!-- Addr 2 -->
  <rect x="255" y="50" width="80" height="50" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="295" y="70" text-anchor="middle" font-size="11" fill="#ffffff">Address 2</text>
  <text x="295" y="84" text-anchor="middle" font-size="10" fill="#ffffff">SA / TA</text>
  <text x="295" y="98" text-anchor="middle" font-size="9" fill="#ffffff">6 bytes</text>

  <!-- Addr 3 -->
  <rect x="340" y="50" width="80" height="50" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="380" y="70" text-anchor="middle" font-size="11" fill="#ffffff">Address 3</text>
  <text x="380" y="84" text-anchor="middle" font-size="10" fill="#ffffff">BSSID</text>
  <text x="380" y="98" text-anchor="middle" font-size="9" fill="#ffffff">6 bytes</text>

  <!-- Seq Ctrl -->
  <rect x="425" y="50" width="65" height="50" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="457" y="70" text-anchor="middle" font-size="11" fill="#abb2bf">Seq</text>
  <text x="457" y="84" text-anchor="middle" font-size="11" fill="#abb2bf">Control</text>
  <text x="457" y="98" text-anchor="middle" font-size="9" fill="#e5c07b">2 bytes</text>

  <!-- Addr 4 (optional) -->
  <rect x="495" y="50" width="70" height="50" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b" stroke-dasharray="4,3"/>
  <text x="530" y="70" text-anchor="middle" font-size="11" fill="#abb2bf">Addr 4</text>
  <text x="530" y="84" text-anchor="middle" font-size="10" fill="#abb2bf">(optional)</text>
  <text x="530" y="98" text-anchor="middle" font-size="9" fill="#e5c07b">6 bytes</text>

  <!-- Body -->
  <rect x="570" y="50" width="100" height="50" rx="6" ry="6" fill="#98c379" stroke="#78a359"/>
  <text x="620" y="70" text-anchor="middle" font-size="11" fill="#1e2127">Frame Body</text>
  <text x="620" y="84" text-anchor="middle" font-size="10" fill="#1e2127">(Payload)</text>
  <text x="620" y="98" text-anchor="middle" font-size="9" fill="#1e2127">0–2304 B</text>

  <!-- FCS -->
  <rect x="675" y="50" width="55" height="50" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="702" y="70" text-anchor="middle" font-size="11" fill="#abb2bf">FCS</text>
  <text x="702" y="84" text-anchor="middle" font-size="10" fill="#abb2bf">CRC-32</text>
  <text x="702" y="98" text-anchor="middle" font-size="9" fill="#e5c07b">4 bytes</text>

  <!-- MAC Header label -->
  <line x1="20" y1="112" x2="490" y2="112" stroke="#abb2bf" stroke-width="1"/>
  <text x="255" y="126" text-anchor="middle" font-size="11" fill="#abb2bf">← MAC Header (24–30 bytes) →</text>

  <!-- Frame Control Expanded -->
  <text x="400" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#e5c07b">Frame Control Field — 2 bytes (16 bits)</text>

  <!-- FC subfields -->
  <rect x="20" y="168" width="55" height="40" rx="4" ry="4" fill="#e06c75" stroke="#c0515f"/>
  <text x="47" y="183" text-anchor="middle" font-size="10" fill="#fff">Proto</text>
  <text x="47" y="197" text-anchor="middle" font-size="9" fill="#fff">Ver [2b]</text>

  <rect x="80" y="168" width="55" height="40" rx="4" ry="4" fill="#e06c75" stroke="#c0515f"/>
  <text x="107" y="183" text-anchor="middle" font-size="10" fill="#fff">Type</text>
  <text x="107" y="197" text-anchor="middle" font-size="9" fill="#fff">[2b]</text>

  <rect x="140" y="168" width="70" height="40" rx="4" ry="4" fill="#e06c75" stroke="#c0515f"/>
  <text x="175" y="183" text-anchor="middle" font-size="10" fill="#fff">Subtype</text>
  <text x="175" y="197" text-anchor="middle" font-size="9" fill="#fff">[4b]</text>

  <rect x="215" y="168" width="50" height="40" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="240" y="183" text-anchor="middle" font-size="10" fill="#abb2bf">To DS</text>
  <text x="240" y="197" text-anchor="middle" font-size="9" fill="#e5c07b">[1b]</text>

  <rect x="270" y="168" width="55" height="40" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="297" y="183" text-anchor="middle" font-size="10" fill="#abb2bf">From DS</text>
  <text x="297" y="197" text-anchor="middle" font-size="9" fill="#e5c07b">[1b]</text>

  <rect x="330" y="168" width="55" height="40" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="357" y="183" text-anchor="middle" font-size="10" fill="#abb2bf">More</text>
  <text x="357" y="197" text-anchor="middle" font-size="9" fill="#abb2bf">Frag [1b]</text>

  <rect x="390" y="168" width="50" height="40" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="415" y="183" text-anchor="middle" font-size="10" fill="#abb2bf">Retry</text>
  <text x="415" y="197" text-anchor="middle" font-size="9" fill="#e5c07b">[1b]</text>

  <rect x="445" y="168" width="55" height="40" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="472" y="183" text-anchor="middle" font-size="10" fill="#abb2bf">Pwr Mgt</text>
  <text x="472" y="197" text-anchor="middle" font-size="9" fill="#e5c07b">[1b]</text>

  <rect x="505" y="168" width="55" height="40" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="532" y="183" text-anchor="middle" font-size="10" fill="#abb2bf">More</text>
  <text x="532" y="197" text-anchor="middle" font-size="9" fill="#abb2bf">Data [1b]</text>

  <rect x="565" y="168" width="60" height="40" rx="4" ry="4" fill="#c678dd" stroke="#a558bd"/>
  <text x="595" y="183" text-anchor="middle" font-size="10" fill="#fff">Protected</text>
  <text x="595" y="197" text-anchor="middle" font-size="9" fill="#fff">Frame [1b]</text>

  <rect x="630" y="168" width="50" height="40" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="655" y="183" text-anchor="middle" font-size="10" fill="#abb2bf">Order</text>
  <text x="655" y="197" text-anchor="middle" font-size="9" fill="#e5c07b">[1b]</text>

  <!-- Protected Frame note -->
  <line x1="595" y1="208" x2="595" y2="228" stroke="#c678dd" stroke-width="1.5"/>
  <text x="595" y="242" text-anchor="middle" font-size="10" fill="#c678dd">WEP/CCMP/TKIP bit</text>

  <!-- Frame Types Section -->
  <text x="400" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#e5c07b">Frame Types (Type field)</text>

  <!-- Management -->
  <rect x="30" y="290" width="220" height="100" rx="6" ry="6" fill="#4b5263" stroke="#61afef"/>
  <text x="140" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#61afef">Management (00)</text>
  <text x="140" y="328" text-anchor="middle" font-size="10" fill="#abb2bf">Beacon · Probe Req/Resp</text>
  <text x="140" y="344" text-anchor="middle" font-size="10" fill="#abb2bf">Auth · Deauth</text>
  <text x="140" y="360" text-anchor="middle" font-size="10" fill="#abb2bf">Assoc Req/Resp · Disassoc</text>
  <text x="140" y="378" text-anchor="middle" font-size="10" fill="#e06c75">Unprotected → spoofable</text>

  <!-- Control -->
  <rect x="290" y="290" width="220" height="100" rx="6" ry="6" fill="#4b5263" stroke="#e5c07b"/>
  <text x="400" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#e5c07b">Control (01)</text>
  <text x="400" y="328" text-anchor="middle" font-size="10" fill="#abb2bf">ACK · RTS · CTS</text>
  <text x="400" y="344" text-anchor="middle" font-size="10" fill="#abb2bf">Block ACK (BAck)</text>
  <text x="400" y="360" text-anchor="middle" font-size="10" fill="#abb2bf">PS-Poll · CF-End</text>
  <text x="400" y="378" text-anchor="middle" font-size="10" fill="#abb2bf">Layer 2 flow control</text>

  <!-- Data -->
  <rect x="550" y="290" width="220" height="100" rx="6" ry="6" fill="#4b5263" stroke="#98c379"/>
  <text x="660" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#98c379">Data (10)</text>
  <text x="660" y="328" text-anchor="middle" font-size="10" fill="#abb2bf">Data · Null</text>
  <text x="660" y="344" text-anchor="middle" font-size="10" fill="#abb2bf">QoS Data · QoS Null</text>
  <text x="660" y="360" text-anchor="middle" font-size="10" fill="#abb2bf">Payload carries IP/ARP</text>
  <text x="660" y="378" text-anchor="middle" font-size="10" fill="#98c379">Protected by WEP/CCMP</text>

  <!-- State Machine -->
  <text x="400" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#e5c07b">Station Connection State Machine</text>

  <rect x="50" y="432" width="140" height="36" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="120" y="455" text-anchor="middle" font-size="11" fill="#fff">State 1: Unauthenticated</text>

  <line x1="190" y1="450" x2="270" y2="450" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="443" text-anchor="middle" font-size="9" fill="#abb2bf">Auth</text>

  <rect x="271" y="432" width="130" height="36" rx="6" ry="6" fill="#e5c07b" stroke="#c5a05b"/>
  <text x="336" y="455" text-anchor="middle" font-size="11" fill="#1e2127">State 2: Authenticated</text>

  <line x1="401" y1="450" x2="481" y2="450" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="441" y="443" text-anchor="middle" font-size="9" fill="#abb2bf">Assoc</text>

  <rect x="482" y="432" width="140" height="36" rx="6" ry="6" fill="#98c379" stroke="#78a359"/>
  <text x="552" y="455" text-anchor="middle" font-size="11" fill="#1e2127">State 3: Associated</text>

  <!-- Deauth arrow back -->
  <path d="M 552 468 Q 400 500 120 468" stroke="#e06c75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="498" text-anchor="middle" font-size="9" fill="#e06c75">Deauth / Disassoc → resets to State 1 (spoofable without 802.11w)</text>
</svg>
