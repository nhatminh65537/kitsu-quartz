<svg viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98c379"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
  </defs>

  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">SAE / Dragonfly Key Exchange — WPA3-Personal</text>

  <!-- Client -->
  <rect x="40" y="44" width="130" height="44" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="105" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Client (STA)</text>
  <text x="105" y="78" text-anchor="middle" font-size="10" fill="#fff">knows: password</text>
  <line x1="105" y1="88" x2="105" y2="490" stroke="#e06c75" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- AP -->
  <rect x="630" y="44" width="130" height="44" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="695" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Access Point</text>
  <text x="695" y="78" text-anchor="middle" font-size="10" fill="#fff">knows: password</text>
  <line x1="695" y1="88" x2="695" y2="490" stroke="#61afef" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- PWE derivation (both sides) -->
  <rect x="200" y="50" width="400" height="42" rx="6" ry="6" fill="#4b5263" stroke="#c678dd"/>
  <text x="400" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#c678dd">PWE Derivation (both sides independently)</text>
  <text x="400" y="84" text-anchor="middle" font-size="10" fill="#abb2bf">PWE = hash-to-curve(password, MAC_A, MAC_B, SSID) → EC point</text>

  <!-- Phase label: Commit -->
  <text x="400" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#e5c07b">Phase 1 — Commit</text>

  <!-- Client commit generation -->
  <rect x="40" y="124" width="200" height="54" rx="6" ry="6" fill="#1e2127" stroke="#e06c75"/>
  <text x="140" y="142" text-anchor="middle" font-size="10" fill="#abb2bf">rand scalar r_A ∈ [1, q-1]</text>
  <text x="140" y="157" text-anchor="middle" font-size="10" fill="#abb2bf">mask m_A ∈ [1, q-1]</text>
  <text x="140" y="172" text-anchor="middle" font-size="10" fill="#e5c07b">scalar_A = (r_A + m_A) mod q</text>

  <!-- AP commit generation -->
  <rect x="560" y="124" width="200" height="54" rx="6" ry="6" fill="#1e2127" stroke="#61afef"/>
  <text x="660" y="142" text-anchor="middle" font-size="10" fill="#abb2bf">rand scalar r_B ∈ [1, q-1]</text>
  <text x="660" y="157" text-anchor="middle" font-size="10" fill="#abb2bf">mask m_B ∈ [1, q-1]</text>
  <text x="660" y="172" text-anchor="middle" font-size="10" fill="#e5c07b">scalar_B = (r_B + m_B) mod q</text>

  <!-- EC element computation -->
  <rect x="200" y="128" width="360" height="46" rx="6" ry="6" fill="#1e2127" stroke="#c678dd"/>
  <text x="380" y="146" text-anchor="middle" font-size="10" fill="#c678dd">element_A = -(m_A × PWE)</text>
  <text x="380" y="162" text-anchor="middle" font-size="9" fill="#abb2bf">EC scalar multiplication — maps password to curve point</text>

  <!-- Commit Message STA → AP -->
  <line x1="105" y1="196" x2="685" y2="196" stroke="#98c379" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="180" y="182" width="440" height="26" rx="4" ry="4" fill="#1e2127" stroke="#98c379"/>
  <text x="400" y="200" text-anchor="middle" font-size="10" fill="#98c379">Commit Frame →  scalar_A ‖ element_A  (no password info leaked!)</text>

  <!-- Commit Message AP → STA -->
  <line x1="695" y1="222" x2="115" y2="222" stroke="#98c379" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="180" y="208" width="440" height="26" rx="4" ry="4" fill="#1e2127" stroke="#98c379"/>
  <text x="400" y="226" text-anchor="middle" font-size="10" fill="#98c379">Commit Frame ← scalar_B ‖ element_B</text>

  <!-- Shared secret computation -->
  <rect x="60" y="244" width="680" height="54" rx="6" ry="6" fill="#1e2127" stroke="#c678dd"/>
  <text x="400" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#c678dd">Shared Secret Computation (both sides)</text>
  <text x="400" y="279" text-anchor="middle" font-size="10" fill="#abb2bf">K = r_A × (scalar_B × PWE + element_B)  [Client]  =  r_B × (scalar_A × PWE + element_A)  [AP]</text>
  <text x="400" y="294" text-anchor="middle" font-size="9" fill="#98c379">Both arrive at same K without transmitting it — Zero-Knowledge Proof property</text>

  <!-- PMK derivation -->
  <rect x="200" y="310" width="400" height="36" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="400" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">PMK = KDF(K, "SAE",  scalar_A ‖ scalar_B ‖ element_A ‖ element_B)</text>
  <text x="400" y="340" text-anchor="middle" font-size="9" fill="#fff">Session-unique PMK — cannot be derived from passive capture alone</text>

  <!-- Phase label: Confirm -->
  <text x="400" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#e5c07b">Phase 2 — Confirm</text>

  <!-- Confirm A → B -->
  <line x1="105" y1="384" x2="685" y2="384" stroke="#61afef" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="165" y="370" width="470" height="26" rx="4" ry="4" fill="#1e2127" stroke="#61afef"/>
  <text x="400" y="388" text-anchor="middle" font-size="10" fill="#61afef">Confirm Frame → send_confirm_A = HMAC(KCK_A, scalar_A ‖ scalar_B ‖ element_A ‖ element_B)</text>

  <!-- Confirm B → A -->
  <line x1="695" y1="410" x2="115" y2="410" stroke="#61afef" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="165" y="396" width="470" height="26" rx="4" ry="4" fill="#1e2127" stroke="#61afef"/>
  <text x="400" y="414" text-anchor="middle" font-size="10" fill="#61afef">Confirm Frame ← HMAC(KCK_B, scalar_B ‖ scalar_A ‖ element_B ‖ element_A)</text>

  <!-- Then 4-way handshake -->
  <text x="400" y="440" text-anchor="middle" font-size="10" fill="#abb2bf">→ Both verify confirms. PMK established. → Standard 4-Way Handshake follows to derive PTK/GTK</text>

  <!-- Dragonblood notes -->
  <rect x="30" y="456" width="740" height="76" rx="6" ry="6" fill="#1e2127" stroke="#e06c75"/>
  <text x="400" y="474" text-anchor="middle" font-size="11" font-weight="bold" fill="#e06c75">Dragonblood Attacks (Vanhoef &amp; Ronen, 2019)</text>
  <text x="400" y="491" text-anchor="middle" font-size="10" fill="#abb2bf">Timing side-channel: PWE derivation time varies based on password bits → partial key recovery via timing oracle</text>
  <text x="400" y="508" text-anchor="middle" font-size="10" fill="#abb2bf">Cache side-channel: Cache access patterns during hash-to-curve leak password bits (Flush+Reload attack)</text>
  <text x="400" y="524" text-anchor="middle" font-size="10" fill="#abb2bf">Dragon Drain: Flood AP with SAE commits → exhausts CPU (each commit requires expensive EC ops) → DoS</text>
</svg>
