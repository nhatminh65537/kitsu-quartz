<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e5c07b"/>
    </marker>
  </defs>

  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">WPS PIN Protocol — M1–M8 Exchange + Pixie Dust Attack Point</text>

  <!-- Enrollee (Attacker) -->
  <rect x="40" y="44" width="140" height="44" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="110" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Enrollee</text>
  <text x="110" y="78" text-anchor="middle" font-size="10" fill="#fff">(Attacker / Client)</text>
  <line x1="110" y1="88" x2="110" y2="520" stroke="#e06c75" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Registrar (AP) -->
  <rect x="620" y="44" width="140" height="44" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="690" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Registrar</text>
  <text x="690" y="78" text-anchor="middle" font-size="10" fill="#fff">(AP — Access Point)</text>
  <line x1="690" y1="88" x2="690" y2="520" stroke="#61afef" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- PIN Split annotation -->
  <rect x="270" y="44" width="260" height="44" rx="6" ry="6" fill="#4b5263" stroke="#e5c07b"/>
  <text x="400" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#e5c07b">8-digit PIN — Split Verification</text>
  <text x="400" y="78" text-anchor="middle" font-size="10" fill="#abb2bf">First half [4 digits] → Second half [3 digits + checksum]</text>

  <!-- M1: Enrollee → Registrar -->
  <line x1="110" y1="106" x2="680" y2="106" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="92" width="260" height="26" rx="4" ry="4" fill="#1e2127" stroke="#4b5263"/>
  <text x="340" y="110" text-anchor="middle" font-size="10" fill="#abb2bf">M1: Enrollee Nonce (E-Nonce), MAC addr, DH public key E-PKe</text>

  <!-- M2: Registrar → Enrollee -->
  <line x1="690" y1="132" x2="120" y2="132" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="118" width="260" height="26" rx="4" ry="4" fill="#1e2127" stroke="#4b5263"/>
  <text x="340" y="136" text-anchor="middle" font-size="10" fill="#abb2bf">M2: Registrar Nonce (R-Nonce), DH public key R-PKr</text>

  <!-- DH note -->
  <text x="400" y="158" text-anchor="middle" font-size="9" fill="#c678dd">← Both derive shared DH secret → AuthKey, KeyWrapKey, EMSK →</text>

  <!-- M3 -->
  <line x1="690" y1="170" x2="120" y2="170" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="156" width="260" height="26" rx="4" ry="4" fill="#1e2127" stroke="#4b5263"/>
  <text x="340" y="174" text-anchor="middle" font-size="10" fill="#abb2bf">M3: R-Hash1, R-Hash2 (commitments to PIN halves)</text>

  <!-- M4 -->
  <line x1="110" y1="196" x2="680" y2="196" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="182" width="260" height="26" rx="4" ry="4" fill="#1e2127" stroke="#4b5263"/>
  <text x="340" y="200" text-anchor="middle" font-size="10" fill="#abb2bf">M4: E-Hash1, E-Hash2 (enrollee commitments)</text>

  <!-- M5 — AP reveals E-S1 -->
  <line x1="690" y1="222" x2="120" y2="222" stroke="#e5c07b" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <rect x="185" y="208" width="310" height="26" rx="4" ry="4" fill="#1e2127" stroke="#e5c07b"/>
  <text x="340" y="226" text-anchor="middle" font-size="10" fill="#e5c07b">M5: E-S1 revealed (secret nonce for PIN first half)</text>

  <!-- Pixie Dust attack annotation M5 -->
  <rect x="30" y="240" width="155" height="36" rx="4" ry="4" fill="#e06c75" stroke="#c0515f"/>
  <text x="107" y="256" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">PIXIE DUST</text>
  <text x="107" y="269" text-anchor="middle" font-size="9" fill="#fff">Capture E-S1 here</text>
  <line x1="162" y1="258" x2="183" y2="228" stroke="#e06c75" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- M6 -->
  <line x1="110" y1="292" x2="680" y2="292" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="278" width="260" height="26" rx="4" ry="4" fill="#1e2127" stroke="#4b5263"/>
  <text x="340" y="296" text-anchor="middle" font-size="10" fill="#abb2bf">M6: Enrollee verifies R-Hash1, sends ACK</text>

  <!-- M7 — AP reveals E-S2 -->
  <line x1="690" y1="318" x2="120" y2="318" stroke="#e5c07b" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <rect x="185" y="304" width="310" height="26" rx="4" ry="4" fill="#1e2127" stroke="#e5c07b"/>
  <text x="340" y="322" text-anchor="middle" font-size="10" fill="#e5c07b">M7: E-S2 revealed (secret nonce for PIN second half)</text>

  <!-- Pixie Dust annotation M7 -->
  <rect x="30" y="336" width="155" height="36" rx="4" ry="4" fill="#e06c75" stroke="#c0515f"/>
  <text x="107" y="352" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">PIXIE DUST</text>
  <text x="107" y="365" text-anchor="middle" font-size="9" fill="#fff">Capture E-S2 here</text>
  <line x1="162" y1="354" x2="183" y2="324" stroke="#e06c75" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- M8 -->
  <line x1="690" y1="388" x2="120" y2="388" stroke="#98c379" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="185" y="374" width="310" height="26" rx="4" ry="4" fill="#1e2127" stroke="#98c379"/>
  <text x="340" y="392" text-anchor="middle" font-size="10" fill="#98c379">M8: AP sends Credential (SSID + WPA passphrase, encrypted)</text>

  <!-- Nack on wrong PIN -->
  <line x1="690" y1="414" x2="120" y2="414" stroke="#e06c75" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="400" y="426" text-anchor="middle" font-size="9" fill="#e06c75">NACK (if wrong first half → revealed in M5/M7 check → stops brute-force at 10⁴ not 10⁸)</text>

  <!-- Pixie Dust explanation box -->
  <rect x="30" y="440" width="740" height="104" rx="6" ry="6" fill="#1e2127" stroke="#e06c75"/>
  <text x="400" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#e06c75">Pixie Dust Attack — Offline PIN Recovery</text>
  <text x="400" y="478" text-anchor="middle" font-size="10" fill="#abb2bf">Vulnerability: E-S1 and E-S2 are generated by AP's RNG. Weak chipsets (Ralink/MediaTek/Realtek) use predictable/zero entropy nonces.</text>
  <text x="400" y="496" text-anchor="middle" font-size="10" fill="#abb2bf">Attack: Capture M1–M7 in one exchange. Feed E-Nonce, R-Nonce, E-Hash1/2, R-Hash1/2, E-PKe, R-PKr into pixiewps.</text>
  <text x="400" y="514" text-anchor="middle" font-size="10" fill="#abb2bf">pixiewps bruteforces E-S1 and E-S2 OFFLINE → recovers PIN in seconds → AP sends passphrase in M8.</text>
  <text x="400" y="530" text-anchor="middle" font-size="9" fill="#e06c75">PIN split flaw: First half verified in M5, second in M7 → max 10⁴ + 10³ = 11,000 guesses (not 10⁸)</text>
</svg>
