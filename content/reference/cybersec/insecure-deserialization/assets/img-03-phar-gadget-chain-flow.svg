<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">PHAR Deserialization Attack Flow</text>

  <!-- Step 1: Generate PHAR -->
  <rect x="20" y="50" width="180" height="60" rx="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="110" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1. Generate Payload</text>
  <text x="110" y="92" text-anchor="middle" font-size="11" fill="#ffffff">phpggc --phar phar</text>
  <text x="110" y="108" text-anchor="middle" font-size="10" fill="#ffffff">Laravel/RCE1 system 'id'</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="80" x2="240" y2="80" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Disguise -->
  <rect x="240" y="50" width="160" height="60" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="320" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#e5c07b">2. Disguise File</text>
  <text x="320" y="92" text-anchor="middle" font-size="11" fill="#abb2bf">Add GIF89a header</text>
  <text x="320" y="108" text-anchor="middle" font-size="11" fill="#abb2bf">payload.phar → evil.gif</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="80" x2="440" y2="80" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Upload -->
  <rect x="440" y="50" width="150" height="60" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="515" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#e5c07b">3. Upload</text>
  <text x="515" y="92" text-anchor="middle" font-size="11" fill="#abb2bf">POST /upload</text>
  <text x="515" y="108" text-anchor="middle" font-size="11" fill="#abb2bf">evil.gif (PHAR inside)</text>

  <!-- Arrow 3 -->
  <line x1="590" y1="80" x2="630" y2="80" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Server stores -->
  <rect x="630" y="50" width="150" height="60" rx="6" fill="#61afef" stroke="#4090cf"/>
  <text x="705" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">4. Stored</text>
  <text x="705" y="92" text-anchor="middle" font-size="11" fill="#ffffff">/uploads/evil.gif</text>
  <text x="705" y="108" text-anchor="middle" font-size="11" fill="#ffffff">Server saves file</text>

  <!-- Vertical arrow down from server -->
  <line x1="705" y1="110" x2="705" y2="165" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Trigger via phar:// -->
  <rect x="540" y="165" width="320" height="55" rx="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="700" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">5. Trigger via phar:// wrapper</text>
  <text x="700" y="208" text-anchor="middle" font-size="11" fill="#ffffff">file_exists("phar:///uploads/evil.gif")</text>

  <!-- Arrow left to PHP internals -->
  <line x1="540" y1="192" x2="460" y2="192" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- PHP internals box -->
  <rect x="240" y="165" width="220" height="55" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="350" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#e5c07b">PHP PHAR Handler</text>
  <text x="350" y="208" text-anchor="middle" font-size="11" fill="#abb2bf">Deserializes PHAR metadata</text>

  <!-- Arrow left to deserialization -->
  <line x1="240" y1="192" x2="160" y2="192" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Deserialization trigger -->
  <rect x="20" y="165" width="140" height="55" rx="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="90" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">unserialize()</text>
  <text x="90" y="201" text-anchor="middle" font-size="10" fill="#ffffff">called automatically</text>
  <text x="90" y="215" text-anchor="middle" font-size="10" fill="#ffffff">no explicit call needed</text>

  <!-- Arrow down to POP chain -->
  <line x1="90" y1="220" x2="90" y2="265" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- POP Chain -->
  <rect x="20" y="265" width="760" height="80" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="400" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#e5c07b">POP Chain Execution (Property-Oriented Programming)</text>

  <!-- Chain boxes -->
  <rect x="30" y="295" width="130" height="40" rx="4" fill="#e06c75" stroke="#c0515f"/>
  <text x="95" y="313" text-anchor="middle" font-size="11" fill="#ffffff">__wakeup()</text>
  <text x="95" y="328" text-anchor="middle" font-size="10" fill="#ffcccc">ClassA (entry)</text>

  <line x1="160" y1="315" x2="185" y2="315" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>

  <rect x="185" y="295" width="130" height="40" rx="4" fill="#e06c75" stroke="#c0515f"/>
  <text x="250" y="313" text-anchor="middle" font-size="11" fill="#ffffff">__toString()</text>
  <text x="250" y="328" text-anchor="middle" font-size="10" fill="#ffcccc">ClassB (pivot)</text>

  <line x1="315" y1="315" x2="340" y2="315" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>

  <rect x="340" y="295" width="130" height="40" rx="4" fill="#e06c75" stroke="#c0515f"/>
  <text x="405" y="313" text-anchor="middle" font-size="11" fill="#ffffff">__destruct()</text>
  <text x="405" y="328" text-anchor="middle" font-size="10" fill="#ffcccc">ClassC (pivot)</text>

  <line x1="470" y1="315" x2="495" y2="315" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>

  <rect x="495" y="295" width="130" height="40" rx="4" fill="#98c379" stroke="#78a359"/>
  <text x="560" y="313" text-anchor="middle" font-size="11" fill="#1e2127">eval() / exec()</text>
  <text x="560" y="328" text-anchor="middle" font-size="10" fill="#1e2127">ClassD (sink)</text>

  <line x1="625" y1="315" x2="650" y2="315" stroke="#98c379" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="650" y="295" width="120" height="40" rx="4" fill="#98c379" stroke="#78a359"/>
  <text x="710" y="313" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e2127">RCE ✓</text>
  <text x="710" y="328" text-anchor="middle" font-size="10" fill="#1e2127">system('id') executes</text>

  <!-- Note box -->
  <rect x="20" y="365" width="760" height="55" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="400" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#e5c07b">Key insight: ANY PHP filesystem function triggers PHAR deserialization — không cần gọi unserialize() explicitly</text>
  <text x="400" y="403" text-anchor="middle" font-size="11" fill="#abb2bf">file_exists() · fopen() · file_get_contents() · getimagesize() · SplFileObject · ZipArchive...</text>
  <text x="400" y="418" text-anchor="middle" font-size="11" fill="#abb2bf">PHP version phải &lt; 8.0 (PHAR metadata deserialization removed in PHP 8.0)</text>
</svg>
