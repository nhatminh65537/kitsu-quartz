<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">Serialization Format Comparison — PHP / Java / Python Pickle</text>

  <!-- PHP Column -->
  <rect x="20" y="50" width="240" height="40" rx="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="140" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">PHP serialize()</text>

  <rect x="20" y="105" width="240" height="100" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="30" y="125" font-size="11" fill="#e5c07b">Object: User{name:"admin",admin:true}</text>
  <text x="30" y="145" font-size="11" fill="#98c379">O:4:"User":2:{</text>
  <text x="30" y="160" font-size="11" fill="#98c379">  s:4:"name";s:5:"admin";</text>
  <text x="30" y="175" font-size="11" fill="#98c379">  s:5:"admin";b:1;</text>
  <text x="30" y="190" font-size="11" fill="#98c379">}</text>

  <rect x="20" y="220" width="240" height="80" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="140" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#e5c07b">Magic Methods (auto-called)</text>
  <text x="30" y="258" font-size="11" fill="#abb2bf">__wakeup()  — on unserialize()</text>
  <text x="30" y="274" font-size="11" fill="#abb2bf">__destruct() — on object destroy</text>
  <text x="30" y="290" font-size="11" fill="#abb2bf">__toString() — on string cast</text>

  <rect x="20" y="315" width="240" height="50" rx="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="140" y="338" text-anchor="middle" font-size="11" fill="#ffffff">Attack Surface</text>
  <text x="140" y="355" text-anchor="middle" font-size="11" fill="#ffffff">unserialize(user_input)</text>

  <rect x="20" y="380" width="240" height="50" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="140" y="400" text-anchor="middle" font-size="11" fill="#e5c07b">Tools</text>
  <text x="140" y="418" text-anchor="middle" font-size="11" fill="#abb2bf">PHPGGC · phpggc -l</text>

  <!-- Java Column -->
  <rect x="280" y="50" width="240" height="40" rx="6" fill="#61afef" stroke="#4090cf"/>
  <text x="400" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Java ObjectOutputStream</text>

  <rect x="280" y="105" width="240" height="100" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="290" y="125" font-size="11" fill="#e5c07b">Magic bytes (hex):</text>
  <text x="290" y="143" font-size="12" fill="#e06c75">AC ED 00 05</text>
  <text x="290" y="161" font-size="11" fill="#e5c07b">Base64 prefix:</text>
  <text x="290" y="179" font-size="12" fill="#e06c75">rO0A...</text>
  <text x="290" y="197" font-size="11" fill="#abb2bf">Binary format — không human-readable</text>

  <rect x="280" y="220" width="240" height="80" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="400" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#e5c07b">Magic Methods (auto-called)</text>
  <text x="290" y="258" font-size="11" fill="#abb2bf">readObject()   — on deserialization</text>
  <text x="290" y="274" font-size="11" fill="#abb2bf">readResolve()  — after readObject</text>
  <text x="290" y="290" font-size="11" fill="#abb2bf">finalize()     — on GC</text>

  <rect x="280" y="315" width="240" height="50" rx="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="400" y="338" text-anchor="middle" font-size="11" fill="#ffffff">Attack Surface</text>
  <text x="400" y="355" text-anchor="middle" font-size="11" fill="#ffffff">ObjectInputStream.readObject()</text>

  <rect x="280" y="380" width="240" height="50" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="400" y="400" text-anchor="middle" font-size="11" fill="#e5c07b">Tools</text>
  <text x="400" y="418" text-anchor="middle" font-size="11" fill="#abb2bf">ysoserial · GadgetProbe</text>

  <!-- Python Column -->
  <rect x="540" y="50" width="240" height="40" rx="6" fill="#98c379" stroke="#78a359"/>
  <text x="660" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e2127">Python pickle</text>

  <rect x="540" y="105" width="240" height="100" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="550" y="125" font-size="11" fill="#e5c07b">Opcode stream (pickletools):</text>
  <text x="550" y="143" font-size="11" fill="#98c379">    0: \x80 PROTO      2</text>
  <text x="550" y="159" font-size="11" fill="#98c379">    2: c    GLOBAL 'os system'</text>
  <text x="550" y="175" font-size="11" fill="#98c379">   13: X    SHORT_BINUNICODE 'id'</text>
  <text x="550" y="191" font-size="11" fill="#98c379">   18: \x85 TUPLE1</text>
  <text x="550" y="207" font-size="11" fill="#98c379">   19: R    REDUCE → exec</text>

  <rect x="540" y="220" width="240" height="80" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="660" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#e5c07b">Magic Methods (auto-called)</text>
  <text x="550" y="258" font-size="11" fill="#abb2bf">__reduce__()   — on pickle.dumps()</text>
  <text x="550" y="274" font-size="11" fill="#abb2bf">__reduce_ex__() — version-aware</text>
  <text x="550" y="290" font-size="11" fill="#abb2bf">__setstate__() — on load w/ state</text>

  <rect x="540" y="315" width="240" height="50" rx="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="660" y="338" text-anchor="middle" font-size="11" fill="#ffffff">Attack Surface</text>
  <text x="660" y="355" text-anchor="middle" font-size="11" fill="#ffffff">pickle.loads() / cPickle.loads()</text>

  <rect x="540" y="380" width="240" height="50" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="660" y="400" text-anchor="middle" font-size="11" fill="#e5c07b">Tools</text>
  <text x="660" y="418" text-anchor="middle" font-size="11" fill="#abb2bf">pickletools · pwntools</text>

  <!-- Bottom labels -->
  <text x="140" y="460" text-anchor="middle" font-size="11" fill="#abb2bf">Text format · Easy to read/modify</text>
  <text x="400" y="460" text-anchor="middle" font-size="11" fill="#abb2bf">Binary format · Gadget chain required</text>
  <text x="660" y="460" text-anchor="middle" font-size="11" fill="#abb2bf">Opcode-based VM · __reduce__ is key</text>

  <!-- Common label -->
  <text x="400" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#e5c07b">Shared principle: user-controlled data → deserialization → code execution</text>
</svg>
