<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">Python Pickle VM — Opcode Execution Model</text>

  <!-- Left: Pickle stream -->
  <rect x="20" y="50" width="200" height="30" rx="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="120" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Malicious Pickle Stream</text>

  <rect x="20" y="90" width="200" height="185" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="30" y="110" font-size="11" fill="#e5c07b">pickletools.dis() output:</text>
  <text x="30" y="130" font-size="11" fill="#98c379">    0: \x80 PROTO    4</text>
  <text x="30" y="148" font-size="11" fill="#e06c75">    2: \x95 FRAME</text>
  <text x="30" y="166" font-size="11" fill="#98c379">   11: c    GLOBAL</text>
  <text x="30" y="178" font-size="10" fill="#abb2bf">         'os system'</text>
  <text x="30" y="196" font-size="11" fill="#98c379">   22: \x8c SHORT_BINUNICODE</text>
  <text x="30" y="208" font-size="10" fill="#abb2bf">         'id'</text>
  <text x="30" y="226" font-size="11" fill="#98c379">   26: \x85 TUPLE1</text>
  <text x="30" y="244" font-size="11" fill="#e06c75">   27: R    REDUCE  ← exec!</text>
  <text x="30" y="262" font-size="11" fill="#98c379">   28: .    STOP</text>

  <!-- Arrow to Pickle VM -->
  <line x1="220" y1="182" x2="270" y2="182" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pickle VM (stack machine) -->
  <rect x="270" y="50" width="250" height="30" rx="6" fill="#61afef" stroke="#4090cf"/>
  <text x="395" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Pickle Virtual Machine (Stack)</text>

  <rect x="270" y="90" width="250" height="185" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="280" y="110" font-size="11" fill="#e5c07b">Stack state progression:</text>
  <text x="280" y="130" font-size="11" fill="#abb2bf">after GLOBAL:</text>
  <text x="280" y="146" font-size="11" fill="#98c379">  [&lt;built-in os.system&gt;]</text>
  <text x="280" y="166" font-size="11" fill="#abb2bf">after SHORT_BINUNICODE:</text>
  <text x="280" y="182" font-size="11" fill="#98c379">  [&lt;os.system&gt;, 'id']</text>
  <text x="280" y="202" font-size="11" fill="#abb2bf">after TUPLE1:</text>
  <text x="280" y="218" font-size="11" fill="#98c379">  [&lt;os.system&gt;, ('id',)]</text>
  <text x="280" y="238" font-size="11" fill="#abb2bf">after REDUCE:</text>
  <text x="280" y="254" font-size="11" fill="#e06c75">  calls os.system('id')</text>
  <text x="280" y="262" font-size="10" fill="#abb2bf">  → RCE during unpickling!</text>

  <!-- Arrow to __reduce__ explanation -->
  <line x1="395" y1="275" x2="395" y2="315" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right side: __reduce__ method -->
  <rect x="540" y="50" width="240" height="30" rx="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="660" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">__reduce__ — High Level</text>

  <rect x="540" y="90" width="240" height="185" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="550" y="110" font-size="11" fill="#e5c07b">Simple exploit class:</text>
  <text x="550" y="130" font-size="11" fill="#98c379">import os, pickle</text>
  <text x="550" y="148" font-size="11" fill="#98c379">class RCE:</text>
  <text x="550" y="166" font-size="11" fill="#98c379">  def __reduce__(self):</text>
  <text x="550" y="184" font-size="11" fill="#e06c75">    return (os.system,</text>
  <text x="550" y="202" font-size="11" fill="#e06c75">            ('id',))</text>
  <text x="550" y="222" font-size="10" fill="#abb2bf">// Return: (callable, args)</text>
  <text x="550" y="240" font-size="10" fill="#abb2bf">// pickle.loads() will call:</text>
  <text x="550" y="257" font-size="10" fill="#e06c75">// callable(*args) → os.system('id')</text>

  <!-- Arrow from __reduce__ down -->
  <line x1="660" y1="275" x2="660" y2="315" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Bottom boxes -->
  <rect x="270" y="315" width="250" height="65" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="395" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#e5c07b">django.core.signing — real attack</text>
  <text x="395" y="352" text-anchor="middle" font-size="11" fill="#abb2bf">Django cache uses pickle internally</text>
  <text x="395" y="369" text-anchor="middle" font-size="11" fill="#abb2bf">FileBasedCache stores .djcache files</text>
  <text x="395" y="383" text-anchor="middle" font-size="10" fill="#e06c75">world-writable → poison → RCE as web user</text>

  <rect x="540" y="315" width="240" height="65" rx="6" fill="#98c379" stroke="#78a359"/>
  <text x="660" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e2127">RCE ✓</text>
  <text x="660" y="353" text-anchor="middle" font-size="11" fill="#1e2127">Executes on pickle.loads()</text>
  <text x="660" y="371" text-anchor="middle" font-size="11" fill="#1e2127">Before any app code runs</text>
  <text x="660" y="383" text-anchor="middle" font-size="10" fill="#1e2127">No way to "catch" — too late!</text>

  <!-- Bottom note -->
  <rect x="20" y="395" width="760" height="35" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="400" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#e5c07b">Pickle warning from Python docs: "Never unpickle data from untrusted sources"</text>
  <text x="400" y="425" text-anchor="middle" font-size="10" fill="#abb2bf">Unsafe: pickle.loads() · cPickle.loads() · shelve.open() · joblib.load() · torch.load() · numpy.load() (allow_pickle=True)</text>
</svg>
