<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98c379"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">Java Deserialization — ObjectInputStream.readObject() Internal Flow</text>

  <!-- Attacker input -->
  <rect x="20" y="50" width="180" height="55" rx="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="110" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Attacker Input</text>
  <text x="110" y="91" text-anchor="middle" font-size="11" fill="#ffffff">AC ED 00 05 ...</text>
  <text x="110" y="98" text-anchor="middle" font-size="10" fill="#ffcccc">(serialized bytes)</text>

  <!-- Arrow to ObjectInputStream -->
  <line x1="200" y1="77" x2="255" y2="77" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- ObjectInputStream -->
  <rect x="255" y="50" width="230" height="55" rx="6" fill="#61afef" stroke="#4090cf"/>
  <text x="370" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">ObjectInputStream</text>
  <text x="370" y="91" text-anchor="middle" font-size="11" fill="#ffffff">.readObject()</text>

  <!-- Arrow right to class lookup -->
  <line x1="485" y1="77" x2="540" y2="77" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Class lookup -->
  <rect x="540" y="50" width="240" height="55" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="660" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#e5c07b">ClassLoader Lookup</text>
  <text x="660" y="91" text-anchor="middle" font-size="11" fill="#abb2bf">Tìm class trong JVM classpath</text>

  <!-- Arrow down from ObjectInputStream -->
  <line x1="370" y1="105" x2="370" y2="155" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: custom readObject? -->
  <rect x="220" y="155" width="300" height="50" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="370" y="176" text-anchor="middle" font-size="12" fill="#abb2bf">Class có custom</text>
  <text x="370" y="193" text-anchor="middle" font-size="12" fill="#e5c07b">readObject() method?</text>

  <!-- Yes branch -->
  <line x1="340" y1="205" x2="260" y2="250" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="275" y="235" font-size="11" fill="#e06c75">Yes</text>

  <rect x="100" y="250" width="200" height="55" rx="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="200" y="273" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Custom readObject()</text>
  <text x="200" y="291" text-anchor="middle" font-size="11" fill="#ffffff">Attacker-influenced code</text>

  <!-- No branch -->
  <line x1="400" y1="205" x2="470" y2="250" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="235" font-size="11" fill="#abb2bf">No</text>

  <rect x="420" y="250" width="200" height="55" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="520" y="273" text-anchor="middle" font-size="12" fill="#abb2bf">Default deserialization</text>
  <text x="520" y="291" text-anchor="middle" font-size="11" fill="#abb2bf">Field restoration only</text>

  <!-- Arrow from custom readObject down to gadget chain -->
  <line x1="200" y1="305" x2="200" y2="355" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Arrow from default down to gadget chain (maybe) -->
  <line x1="520" y1="305" x2="520" y2="355" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="335" font-size="10" fill="#abb2bf">Restored fields</text>
  <text x="525" y="348" font-size="10" fill="#abb2bf">can still trigger</text>

  <!-- Gadget chain box -->
  <rect x="20" y="355" width="560" height="70" rx="6" fill="#4b5263" stroke="#e06c75" stroke-width="2"/>
  <text x="300" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#e5c07b">Gadget Chain — Property-Oriented Programming (POP)</text>
  <text x="300" y="393" text-anchor="middle" font-size="11" fill="#abb2bf">Entry gadget (readObject) → pivot gadgets (invoke/transform) → sink gadget (exec/eval)</text>
  <text x="300" y="411" text-anchor="middle" font-size="11" fill="#e06c75">Runtime.exec() / ProcessBuilder / JNDI lookup / File write...</text>

  <!-- Arrow right to RCE -->
  <line x1="580" y1="390" x2="630" y2="390" stroke="#98c379" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="630" y="360" width="150" height="65" rx="6" fill="#98c379" stroke="#78a359"/>
  <text x="705" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e2127">RCE ✓</text>
  <text x="705" y="403" text-anchor="middle" font-size="11" fill="#1e2127">Code execution</text>
  <text x="705" y="418" text-anchor="middle" font-size="11" fill="#1e2127">on server</text>

  <!-- Classpath note -->
  <rect x="20" y="445" width="760" height="25" rx="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="400" y="462" text-anchor="middle" font-size="11" fill="#e5c07b">Gadget chain requires vulnerable library on classpath: commons-collections, spring-core, commons-beanutils, groovy...</text>
</svg>
