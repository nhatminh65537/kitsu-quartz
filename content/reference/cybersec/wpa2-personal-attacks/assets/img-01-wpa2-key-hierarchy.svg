<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98c379"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">WPA2-Personal Key Hierarchy &amp; 4-Way Handshake</text>

  <!-- ===== TOP: PSK/PMK derivation ===== -->
  <!-- PSK box -->
  <rect x="290" y="48" width="220" height="40" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="400" y="64" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">PSK (Pre-Shared Key)</text>
  <text x="400" y="80" text-anchor="middle" font-size="11" fill="#fff">= WiFi Password (8–63 chars)</text>

  <!-- arrow PSK -> PMK -->
  <line x1="400" y1="88" x2="400" y2="118" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <text x="415" y="107" font-size="10" fill="#e5c07b">PBKDF2-SHA1(PSK, SSID, 4096, 256)</text>

  <!-- PMK box -->
  <rect x="290" y="120" width="220" height="40" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="400" y="136" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">PMK (Pairwise Master Key)</text>
  <text x="400" y="152" text-anchor="middle" font-size="11" fill="#fff">256-bit — same for all sessions</text>

  <!-- ===== 4-WAY HANDSHAKE section ===== -->
  <!-- Section label -->
  <text x="400" y="188" text-anchor="middle" font-size="11" fill="#e5c07b">── 4-Way Handshake (EAPOL frames) ──</text>

  <!-- Client col header -->
  <rect x="60" y="200" width="160" height="30" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="140" y="220" text-anchor="middle" font-size="12" fill="#abb2bf" font-weight="bold">Client (Supplicant)</text>

  <!-- AP col header -->
  <rect x="580" y="200" width="160" height="30" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="660" y="220" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">AP (Authenticator)</text>

  <!-- Vertical lines -->
  <line x1="140" y1="230" x2="140" y2="480" stroke="#4b5263" stroke-dasharray="4,3"/>
  <line x1="660" y1="230" x2="660" y2="480" stroke="#61afef" stroke-dasharray="4,3"/>

  <!-- Msg1: AP -> Client (ANonce) -->
  <text x="400" y="256" text-anchor="middle" font-size="10" fill="#abb2bf">y=260</text>
  <line x1="640" y1="260" x2="162" y2="260" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <rect x="270" y="245" width="210" height="20" rx="3" ry="3" fill="#4b5263" stroke="none"/>
  <text x="375" y="258" text-anchor="middle" font-size="11" fill="#e5c07b" font-weight="bold">Msg 1: ANonce</text>

  <!-- Client derives PTK -->
  <rect x="30" y="268" width="220" height="32" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="140" y="282" text-anchor="middle" font-size="10" fill="#abb2bf">PTK = PRF(PMK, ANonce,</text>
  <text x="140" y="295" text-anchor="middle" font-size="10" fill="#abb2bf">SNonce, AP_MAC, STA_MAC)</text>

  <!-- Msg2: Client -> AP (SNonce + MIC) -->
  <line x1="162" y1="318" x2="640" y2="318" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <rect x="270" y="303" width="210" height="20" rx="3" ry="3" fill="#4b5263" stroke="none"/>
  <text x="375" y="316" text-anchor="middle" font-size="11" fill="#e5c07b" font-weight="bold">Msg 2: SNonce + MIC</text>

  <!-- AP derives PTK -->
  <rect x="550" y="326" width="220" height="32" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="660" y="340" text-anchor="middle" font-size="10" fill="#abb2bf">AP derives same PTK,</text>
  <text x="660" y="353" text-anchor="middle" font-size="10" fill="#abb2bf">verifies MIC, installs GTK</text>

  <!-- Msg3: AP -> Client (GTK + MIC) -->
  <line x1="640" y1="376" x2="162" y2="376" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <rect x="258" y="360" width="230" height="20" rx="3" ry="3" fill="#4b5263" stroke="none"/>
  <text x="373" y="373" text-anchor="middle" font-size="11" fill="#e5c07b" font-weight="bold">Msg 3: GTK + MIC (encrypted)</text>
  <!-- KRACK label -->
  <rect x="258" y="380" width="230" height="16" rx="3" ry="3" fill="#e06c75" stroke="none" opacity="0.3"/>
  <text x="373" y="391" text-anchor="middle" font-size="10" fill="#e06c75">⚠ KRACK: replay Msg3 → nonce reuse</text>

  <!-- Msg4: Client -> AP (ACK) -->
  <line x1="162" y1="418" x2="640" y2="418" stroke="#98c379" marker-end="url(#arrow-green)"/>
  <rect x="290" y="403" width="175" height="20" rx="3" ry="3" fill="#4b5263" stroke="none"/>
  <text x="377" y="416" text-anchor="middle" font-size="11" fill="#98c379" font-weight="bold">Msg 4: ACK — keys installed</text>

  <!-- ===== BOTTOM: PTK breakdown ===== -->
  <rect x="155" y="440" width="490" height="52" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="400" y="457" text-anchor="middle" font-size="11" fill="#abb2bf" font-weight="bold">PTK (512-bit) = KCK (128b) | KEK (128b) | TK (128–256b)</text>
  <text x="260" y="473" text-anchor="middle" font-size="10" fill="#e5c07b">KCK: MIC verify</text>
  <text x="400" y="473" text-anchor="middle" font-size="10" fill="#e5c07b">KEK: encrypt Msg3</text>
  <text x="540" y="473" text-anchor="middle" font-size="10" fill="#98c379">TK: encrypt data frames</text>

  <!-- Arrow PMK -> PTK derivation indicator -->
  <line x1="400" y1="160" x2="400" y2="190" stroke="#abb2bf" stroke-dasharray="3,2"/>
</svg>
