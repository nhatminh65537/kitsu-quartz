<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e5c07b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">KRACK — Key Reinstallation Attack (CVE-2017-13077)</text>

  <!-- ===== NORMAL 4-WAY (top section) ===== -->
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#98c379">Normal 4-Way Handshake</text>

  <!-- Client -->
  <rect x="30" y="56" width="120" height="28" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="90" y="75" text-anchor="middle" font-size="11" fill="#abb2bf">Client</text>

  <!-- AP -->
  <rect x="650" y="56" width="120" height="28" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="710" y="75" text-anchor="middle" font-size="11" fill="#fff">AP</text>

  <line x1="90" y1="84" x2="90" y2="200" stroke="#4b5263" stroke-dasharray="3,2"/>
  <line x1="710" y1="84" x2="710" y2="200" stroke="#61afef" stroke-dasharray="3,2"/>

  <!-- Msg1 -->
  <line x1="690" y1="100" x2="112" y2="100" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <text x="400" y="96" text-anchor="middle" font-size="10" fill="#e5c07b">Msg1 (ANonce)</text>

  <!-- Msg2 -->
  <line x1="112" y1="126" x2="690" y2="126" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <text x="400" y="122" text-anchor="middle" font-size="10" fill="#e5c07b">Msg2 (SNonce + MIC)</text>

  <!-- Msg3 -->
  <line x1="690" y1="152" x2="112" y2="152" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <text x="400" y="148" text-anchor="middle" font-size="10" fill="#e5c07b">Msg3 (GTK + MIC) — nonce=0 → key installed → nonce++</text>

  <!-- Msg4 -->
  <line x1="112" y1="178" x2="690" y2="178" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <text x="400" y="174" text-anchor="middle" font-size="10" fill="#98c379">Msg4 (ACK) — encrypted with TK, nonce=1</text>

  <!-- Divider -->
  <line x1="20" y1="210" x2="780" y2="210" stroke="#4b5263" stroke-dasharray="6,4"/>
  <text x="400" y="226" text-anchor="middle" font-size="12" fill="#e06c75" font-weight="bold">KRACK Attack — Attacker ở giữa (MitM trên channel khác)</text>

  <!-- ===== KRACK ATTACK (bottom section) ===== -->
  <!-- Three parties -->
  <rect x="20" y="238" width="110" height="28" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="75" y="257" text-anchor="middle" font-size="10" fill="#abb2bf">Client</text>

  <rect x="330" y="238" width="140" height="28" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="400" y="253" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Attacker</text>
  <text x="400" y="264" text-anchor="middle" font-size="9" fill="#ddd">(cloned AP — diff channel)</text>

  <rect x="670" y="238" width="110" height="28" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="725" y="257" text-anchor="middle" font-size="10" fill="#fff">AP (real)</text>

  <line x1="75" y1="266" x2="75" y2="418" stroke="#4b5263" stroke-dasharray="3,2"/>
  <line x1="400" y1="266" x2="400" y2="418" stroke="#e06c75" stroke-dasharray="3,2"/>
  <line x1="725" y1="266" x2="725" y2="418" stroke="#61afef" stroke-dasharray="3,2"/>

  <!-- AP sends Msg3 -->
  <line x1="703" y1="286" x2="422" y2="286" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <text x="562" y="282" text-anchor="middle" font-size="10" fill="#e5c07b">Msg3 (GTK + MIC)</text>

  <!-- Attacker forwards Msg3 to Client -->
  <line x1="378" y1="308" x2="97" y2="308" stroke="#e06c75" marker-end="url(#arrow-red)"/>
  <text x="237" y="304" text-anchor="middle" font-size="10" fill="#e06c75">forward Msg3 → Client installs key, nonce→0</text>

  <!-- Client sends Msg4 (nonce=0) -->
  <line x1="97" y1="330" x2="378" y2="330" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <text x="237" y="326" text-anchor="middle" font-size="10" fill="#abb2bf">Msg4 (ACK, TK, nonce=0)</text>

  <!-- Attacker BLOCKS Msg4 -->
  <rect x="360" y="320" width="80" height="18" rx="3" fill="#e06c75"/>
  <text x="400" y="332" text-anchor="middle" font-size="9" fill="#fff">BLOCK Msg4</text>

  <!-- Attacker replays Msg3 again -->
  <line x1="378" y1="356" x2="97" y2="356" stroke="#e06c75" marker-end="url(#arrow-red)"/>
  <text x="237" y="352" text-anchor="middle" font-size="10" fill="#e06c75">replay Msg3 → Client REINSTALLS key → nonce reset→0 again!</text>

  <!-- Client sends data with reused nonce -->
  <line x1="97" y1="378" x2="378" y2="378" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <text x="237" y="374" text-anchor="middle" font-size="10" fill="#e5c07b">data (TK, nonce=0) ← SAME keystream as before!</text>

  <!-- Attacker XOR decrypt -->
  <rect x="330" y="388" width="140" height="30" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="400" y="402" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">XOR: pkt1 ⊕ pkt2 → plaintext</text>
  <text x="400" y="415" text-anchor="middle" font-size="9" fill="#ddd">(AES-CCMP: decrypt; TKIP: also forge)</text>

  <!-- Android note -->
  <rect x="580" y="310" width="200" height="46" rx="6" ry="6" fill="#e5c07b" stroke="#c5a05b"/>
  <text x="680" y="328" text-anchor="middle" font-size="10" fill="#1e2127" font-weight="bold">Android 6.0 worst case:</text>
  <text x="680" y="342" text-anchor="middle" font-size="10" fill="#1e2127">wpa_supplicant clears TK</text>
  <text x="680" y="355" text-anchor="middle" font-size="10" fill="#1e2127">→ reinstalls all-zero key!</text>
</svg>
