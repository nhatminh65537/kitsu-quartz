<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">PMKID Clientless Attack — Computation &amp; Extraction Flow</text>

  <!-- ===== LEFT: Classic attack (needs client) ===== -->
  <rect x="20" y="42" width="340" height="24" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="190" y="58" text-anchor="middle" font-size="12" fill="#e06c75" font-weight="bold">Classic Attack — Cần client kết nối</text>

  <rect x="20" y="70" width="340" height="50" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="190" y="90" text-anchor="middle" font-size="11" fill="#abb2bf">Attacker gửi deauth → Client reconnect</text>
  <text x="190" y="106" text-anchor="middle" font-size="11" fill="#abb2bf">→ Capture EAPOL 4-way handshake (4 msgs)</text>

  <line x1="190" y1="120" x2="190" y2="148" stroke="#abb2bf" marker-end="url(#arrow)"/>

  <rect x="20" y="150" width="340" height="34" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="190" y="168" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Cần client hiện tại! (Noise: deauth packets)</text>
  <text x="190" y="182" text-anchor="middle" font-size="10" fill="#fff">Dễ detect — có thể fail nếu không có client</text>

  <!-- ===== Divider ===== -->
  <line x1="400" y1="42" x2="400" y2="340" stroke="#4b5263" stroke-dasharray="6,4"/>
  <text x="400" y="200" text-anchor="middle" font-size="11" fill="#4b5263" transform="rotate(-90, 400, 200)">vs</text>

  <!-- ===== RIGHT: PMKID attack (clientless) ===== -->
  <rect x="440" y="42" width="340" height="24" rx="4" ry="4" fill="#98c379" stroke="#78a359"/>
  <text x="610" y="58" text-anchor="middle" font-size="12" fill="#1e2127" font-weight="bold">PMKID Attack — Không cần client (2018)</text>

  <!-- Step 1 -->
  <rect x="440" y="70" width="340" height="40" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="610" y="87" text-anchor="middle" font-size="11" fill="#abb2bf">Attacker gửi EAPOL-Start / Association</text>
  <text x="610" y="103" text-anchor="middle" font-size="11" fill="#e5c07b">AP trả lời Msg1 với RSN IE chứa PMKID</text>

  <line x1="610" y1="110" x2="610" y2="128" stroke="#abb2bf" marker-end="url(#arrow)"/>

  <!-- PMKID Formula box -->
  <rect x="440" y="130" width="340" height="60" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="610" y="150" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">PMKID Formula</text>
  <text x="610" y="166" text-anchor="middle" font-size="11" fill="#fff">PMKID = HMAC-SHA1-128(</text>
  <text x="610" y="182" text-anchor="middle" font-size="11" fill="#e5c07b">PMK, "PMK Name" || AP_MAC || STA_MAC</text>
  <text x="610" y="194" text-anchor="middle" font-size="10" fill="#ddd">)</text>

  <line x1="610" y1="192" x2="610" y2="210" stroke="#abb2bf" marker-end="url(#arrow)"/>

  <!-- Known values -->
  <rect x="440" y="212" width="340" height="44" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="610" y="230" text-anchor="middle" font-size="11" fill="#e5c07b" font-weight="bold">Attacker biết tất cả ngoại trừ PMK:</text>
  <text x="610" y="246" text-anchor="middle" font-size="10" fill="#abb2bf">"PMK Name" = constant string · AP_MAC = BSSID · STA_MAC = Attacker MAC</text>
  <text x="610" y="258" text-anchor="middle" font-size="10" fill="#98c379">→ PMK (= f(PSK, SSID)) là unknown → crack offline!</text>

  <!-- ===== BOTTOM: Cracking pipeline ===== -->
  <text x="400" y="285" text-anchor="middle" font-size="13" fill="#abb2bf" font-weight="bold">hcxdumptool → hcxpcapngtool → hashcat -m 22000</text>

  <!-- Pipeline boxes -->
  <rect x="30" y="298" width="165" height="40" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="112" y="315" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">hcxdumptool</text>
  <text x="112" y="330" text-anchor="middle" font-size="10" fill="#fff">capture PMKID → .pcapng</text>

  <line x1="197" y1="318" x2="230" y2="318" stroke="#abb2bf" marker-end="url(#arrow)"/>

  <rect x="232" y="298" width="175" height="40" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="319" y="315" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">hcxpcapngtool</text>
  <text x="319" y="330" text-anchor="middle" font-size="10" fill="#fff">convert → .hc22000</text>

  <line x1="409" y1="318" x2="442" y2="318" stroke="#abb2bf" marker-end="url(#arrow)"/>

  <rect x="444" y="298" width="160" height="40" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="524" y="315" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">hashcat -m 22000</text>
  <text x="524" y="330" text-anchor="middle" font-size="10" fill="#fff">offline dictionary/brute</text>

  <line x1="606" y1="318" x2="639" y2="318" stroke="#abb2bf" marker-end="url(#arrow)"/>

  <rect x="641" y="298" width="139" height="40" rx="6" ry="6" fill="#98c379" stroke="#78a359"/>
  <text x="710" y="315" text-anchor="middle" font-size="11" fill="#1e2127" font-weight="bold">PSK Recovered</text>
  <text x="710" y="330" text-anchor="middle" font-size="10" fill="#1e2127">SSID:password</text>
</svg>
