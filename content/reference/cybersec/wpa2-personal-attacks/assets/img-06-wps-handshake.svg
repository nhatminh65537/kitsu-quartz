<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98c379"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">WPS Protocol — M1–M7 Exchange &amp; Pixie Dust Attack</text>

  <!-- Column headers -->
  <rect x="30" y="40" width="150" height="32" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="105" y="61" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Reaver/Bully (Enrollee)</text>

  <rect x="330" y="40" width="140" height="32" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="400" y="61" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">AP (Registrar)</text>

  <rect x="590" y="40" width="180" height="32" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="680" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Pixie Dust Attack</text>
  <text x="680" y="70" text-anchor="middle" font-size="10" fill="#ddd">(offline — pixiewps)</text>

  <!-- Vertical lines -->
  <line x1="105" y1="72" x2="105" y2="450" stroke="#e06c75" stroke-dasharray="4,3"/>
  <line x1="400" y1="72" x2="400" y2="450" stroke="#61afef" stroke-dasharray="4,3"/>

  <!-- M1: Enrollee → Registrar (PKe) -->
  <line x1="127" y1="98" x2="378" y2="98" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <rect x="195" y="84" width="165" height="18" rx="3" ry="3" fill="#4b5263"/>
  <text x="277" y="97" text-anchor="middle" font-size="11" fill="#e5c07b">M1: PKe (Enrollee pub key)</text>

  <!-- M2: Registrar → Enrollee (PKr, E-Nonce, AuthKey) -->
  <line x1="378" y1="128" x2="127" y2="128" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <rect x="180" y="114" width="200" height="18" rx="3" ry="3" fill="#4b5263"/>
  <text x="280" y="127" text-anchor="middle" font-size="11" fill="#e5c07b">M2: PKr, E-Nonce, AuthKey</text>
  <!-- Intercept arrow -->
  <line x1="420" y1="128" x2="570" y2="128" stroke="#e06c75" stroke-dasharray="4,2" marker-end="url(#arrow-red)"/>
  <text x="495" y="123" text-anchor="middle" font-size="9" fill="#e06c75">intercept PKr, E-Nonce</text>

  <!-- M3: Enrollee → Registrar (E-Hash1, E-Hash2) -->
  <line x1="127" y1="168" x2="378" y2="168" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <rect x="155" y="154" width="240" height="18" rx="3" ry="3" fill="#4b5263"/>
  <text x="275" y="167" text-anchor="middle" font-size="11" fill="#e5c07b">M3: E-Hash1, E-Hash2, AuthKey</text>
  <!-- Intercept arrow -->
  <line x1="420" y1="168" x2="570" y2="168" stroke="#e06c75" stroke-dasharray="4,2" marker-end="url(#arrow-red)"/>
  <text x="495" y="163" text-anchor="middle" font-size="9" fill="#e06c75">intercept E-Hash1, E-Hash2</text>

  <!-- M4: Registrar → Enrollee (R-Hash1) -->
  <line x1="378" y1="198" x2="127" y2="198" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <rect x="195" y="184" width="165" height="18" rx="3" ry="3" fill="#4b5263"/>
  <text x="277" y="197" text-anchor="middle" font-size="11" fill="#abb2bf">M4: R-Hash1</text>

  <!-- STOP / Pixie Dust happens here -->
  <rect x="30" y="210" width="370" height="24" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="215" y="226" text-anchor="middle" font-size="10" fill="#e5c07b">⚡ Reaver pauses — pixiewps runs offline crack</text>

  <!-- pixiewps box -->
  <rect x="580" y="200" width="200" height="80" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="680" y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">pixiewps offline attack</text>
  <text x="680" y="235" text-anchor="middle" font-size="10" fill="#ddd">Ralink: E-S1=E-S2=0x00</text>
  <text x="680" y="248" text-anchor="middle" font-size="10" fill="#ddd">Broadcom: weak rand()</text>
  <text x="680" y="261" text-anchor="middle" font-size="10" fill="#ddd">Realtek: timestamp seed</text>
  <text x="680" y="275" text-anchor="middle" font-size="10" fill="#98c379">→ recover E-S1, E-S2</text>

  <!-- Arrow from pixiewps to M5 -->
  <line x1="580" y1="278" x2="430" y2="290" stroke="#98c379" marker-end="url(#arrow-green)"/>
  <text x="510" y="285" font-size="9" fill="#98c379">PIN found!</text>

  <!-- M5: Enrollee → Registrar (E-S1, correct PIN first half) -->
  <line x1="127" y1="298" x2="378" y2="298" stroke="#98c379" marker-end="url(#arrow-green)"/>
  <rect x="155" y="284" width="240" height="18" rx="3" ry="3" fill="#4b5263"/>
  <text x="275" y="297" text-anchor="middle" font-size="11" fill="#98c379">M5: E-S1 (first half PIN verified)</text>

  <!-- M6: Registrar → Enrollee -->
  <line x1="378" y1="326" x2="127" y2="326" stroke="#98c379" marker-end="url(#arrow-green)"/>
  <rect x="195" y="312" width="165" height="18" rx="3" ry="3" fill="#4b5263"/>
  <text x="277" y="325" text-anchor="middle" font-size="11" fill="#98c379">M6: R-S1 (AP confirms)</text>

  <!-- M7: Enrollee → Registrar (E-S2, second half PIN) -->
  <line x1="127" y1="356" x2="378" y2="356" stroke="#98c379" marker-end="url(#arrow-green)"/>
  <rect x="155" y="342" width="240" height="18" rx="3" ry="3" fill="#4b5263"/>
  <text x="275" y="355" text-anchor="middle" font-size="11" fill="#98c379">M7: E-S2 → AP sends WPA PSK!</text>

  <!-- Final result -->
  <rect x="30" y="374" width="370" height="36" rx="6" ry="6" fill="#98c379" stroke="#78a359"/>
  <text x="215" y="390" text-anchor="middle" font-size="12" fill="#1e2127" font-weight="bold">WPS PIN + WPA PSK recovered!</text>
  <text x="215" y="404" text-anchor="middle" font-size="10" fill="#1e2127">Time: milliseconds to minutes (vs hours for online brute force)</text>

  <!-- E-Hash formula -->
  <rect x="420" y="374" width="360" height="52" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="600" y="392" text-anchor="middle" font-size="11" fill="#e5c07b" font-weight="bold">E-Hash Formula (HMAC-MD5):</text>
  <text x="600" y="407" text-anchor="middle" font-size="10" fill="#abb2bf">E-Hash1 = HMAC-MD5(AuthKey, E-S1 || PSK1 || PKe || PKr)</text>
  <text x="600" y="420" text-anchor="middle" font-size="10" fill="#abb2bf">E-Hash2 = HMAC-MD5(AuthKey, E-S2 || PSK2 || PKe || PKr)</text>
  <text x="600" y="435" text-anchor="middle" font-size="9" fill="#e06c75">Weakness: E-S1, E-S2 không random → recoverable!</text>

  <!-- PIN split note -->
  <rect x="30" y="434" width="370" height="30" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="215" y="447" text-anchor="middle" font-size="10" fill="#abb2bf">WPS PIN: 8 digits = 4 digits (10^4=10000) + 3 digits (10^3=1000) + checksum</text>
  <text x="215" y="460" text-anchor="middle" font-size="10" fill="#e5c07b">→ Only 11,000 combinations to brute force (not 10^8 = 100M)</text>
</svg>
