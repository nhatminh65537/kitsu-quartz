<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#abb2bf">802.11 MPDU Frame Structure (Data Frame)</text>

  <!-- ===== MAC Header ===== -->
  <!-- Frame Control -->
  <rect x="20" y="44" width="80" height="48" rx="4" ry="4" fill="#61afef" stroke="#4090cf"/>
  <text x="60" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Frame</text>
  <text x="60" y="78" text-anchor="middle" font-size="10" fill="#fff">Control</text>
  <text x="60" y="90" text-anchor="middle" font-size="9" fill="#ddd">2 bytes</text>

  <!-- Duration -->
  <rect x="102" y="44" width="60" height="48" rx="4" ry="4" fill="#61afef" stroke="#4090cf"/>
  <text x="132" y="65" text-anchor="middle" font-size="10" fill="#fff">Dur/ID</text>
  <text x="132" y="90" text-anchor="middle" font-size="9" fill="#ddd">2 bytes</text>

  <!-- Addr1 -->
  <rect x="164" y="44" width="80" height="48" rx="4" ry="4" fill="#61afef" stroke="#4090cf"/>
  <text x="204" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Addr1</text>
  <text x="204" y="78" text-anchor="middle" font-size="9" fill="#ddd">(Dest)</text>
  <text x="204" y="90" text-anchor="middle" font-size="9" fill="#ddd">6 bytes</text>

  <!-- Addr2 -->
  <rect x="246" y="44" width="80" height="48" rx="4" ry="4" fill="#61afef" stroke="#4090cf"/>
  <text x="286" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Addr2</text>
  <text x="286" y="78" text-anchor="middle" font-size="9" fill="#ddd">(Src)</text>
  <text x="286" y="90" text-anchor="middle" font-size="9" fill="#ddd">6 bytes</text>

  <!-- Addr3 -->
  <rect x="328" y="44" width="80" height="48" rx="4" ry="4" fill="#61afef" stroke="#4090cf"/>
  <text x="368" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Addr3</text>
  <text x="368" y="78" text-anchor="middle" font-size="9" fill="#ddd">(BSSID)</text>
  <text x="368" y="90" text-anchor="middle" font-size="9" fill="#ddd">6 bytes</text>

  <!-- Seq Control -->
  <rect x="410" y="44" width="70" height="48" rx="4" ry="4" fill="#61afef" stroke="#4090cf"/>
  <text x="445" y="65" text-anchor="middle" font-size="10" fill="#fff">Seq</text>
  <text x="445" y="78" text-anchor="middle" font-size="10" fill="#fff">Control</text>
  <text x="445" y="90" text-anchor="middle" font-size="9" fill="#ddd">2 bytes</text>

  <!-- MAC Header label -->
  <rect x="20" y="96" width="460" height="14" rx="2" ry="2" fill="#4b5263" stroke="none"/>
  <text x="250" y="107" text-anchor="middle" font-size="10" fill="#abb2bf">MAC Header (24–30 bytes)</text>

  <!-- ===== CCMP Header (encrypted part) ===== -->
  <rect x="482" y="44" width="80" height="48" rx="4" ry="4" fill="#e5c07b" stroke="#c5a05b"/>
  <text x="522" y="62" text-anchor="middle" font-size="10" fill="#1e2127" font-weight="bold">CCMP</text>
  <text x="522" y="75" text-anchor="middle" font-size="10" fill="#1e2127">Header</text>
  <text x="522" y="88" text-anchor="middle" font-size="9" fill="#1e2127">8 bytes</text>

  <!-- Frame Body -->
  <rect x="564" y="44" width="130" height="48" rx="4" ry="4" fill="#98c379" stroke="#78a359"/>
  <text x="629" y="62" text-anchor="middle" font-size="10" fill="#1e2127" font-weight="bold">Frame Body</text>
  <text x="629" y="75" text-anchor="middle" font-size="10" fill="#1e2127">(Payload)</text>
  <text x="629" y="88" text-anchor="middle" font-size="9" fill="#1e2127">0–2304 bytes</text>

  <!-- FCS -->
  <rect x="696" y="44" width="64" height="48" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="728" y="65" text-anchor="middle" font-size="10" fill="#abb2bf">FCS</text>
  <text x="728" y="90" text-anchor="middle" font-size="9" fill="#abb2bf">4 bytes</text>

  <!-- Encrypted region label -->
  <rect x="482" y="96" width="278" height="14" rx="2" ry="2" fill="#e5c07b" stroke="none" opacity="0.4"/>
  <text x="621" y="107" text-anchor="middle" font-size="10" fill="#e5c07b">AES-CCMP encrypted region</text>

  <!-- ===== EAPOL Frame breakdown ===== -->
  <text x="400" y="138" text-anchor="middle" font-size="13" fill="#abb2bf" font-weight="bold">EAPOL Frame (4-Way Handshake Message)</text>

  <!-- Ether Type -->
  <rect x="20" y="152" width="70" height="44" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="55" y="170" text-anchor="middle" font-size="10" fill="#abb2bf">EtherType</text>
  <text x="55" y="183" text-anchor="middle" font-size="9" fill="#abb2bf">0x888E</text>
  <text x="55" y="194" text-anchor="middle" font-size="9" fill="#abb2bf">2 bytes</text>

  <!-- EAPOL version -->
  <rect x="92" y="152" width="55" height="44" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="119" y="170" text-anchor="middle" font-size="10" fill="#abb2bf">Version</text>
  <text x="119" y="194" text-anchor="middle" font-size="9" fill="#abb2bf">1 byte</text>

  <!-- Key Info -->
  <rect x="149" y="152" width="80" height="44" rx="4" ry="4" fill="#c678dd" stroke="#a558bd"/>
  <text x="189" y="168" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Key Info</text>
  <text x="189" y="181" text-anchor="middle" font-size="9" fill="#fff">Type|Cipher</text>
  <text x="189" y="194" text-anchor="middle" font-size="9" fill="#ddd">2 bytes</text>

  <!-- Key Nonce -->
  <rect x="231" y="152" width="90" height="44" rx="4" ry="4" fill="#e06c75" stroke="#c0515f"/>
  <text x="276" y="168" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Key Nonce</text>
  <text x="276" y="181" text-anchor="middle" font-size="9" fill="#fff">ANonce/SNonce</text>
  <text x="276" y="194" text-anchor="middle" font-size="9" fill="#ddd">32 bytes</text>

  <!-- Key MIC -->
  <rect x="323" y="152" width="90" height="44" rx="4" ry="4" fill="#e06c75" stroke="#c0515f"/>
  <text x="368" y="168" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Key MIC</text>
  <text x="368" y="181" text-anchor="middle" font-size="9" fill="#fff">integrity check</text>
  <text x="368" y="194" text-anchor="middle" font-size="9" fill="#ddd">16 bytes</text>

  <!-- Key Data Len -->
  <rect x="415" y="152" width="70" height="44" rx="4" ry="4" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="450" y="170" text-anchor="middle" font-size="10" fill="#abb2bf">Key Data</text>
  <text x="450" y="181" text-anchor="middle" font-size="9" fill="#abb2bf">Length</text>
  <text x="450" y="194" text-anchor="middle" font-size="9" fill="#abb2bf">2 bytes</text>

  <!-- Key Data -->
  <rect x="487" y="152" width="150" height="44" rx="4" ry="4" fill="#98c379" stroke="#78a359"/>
  <text x="562" y="170" text-anchor="middle" font-size="10" fill="#1e2127" font-weight="bold">Key Data</text>
  <text x="562" y="181" text-anchor="middle" font-size="9" fill="#1e2127">RSN IE / GTK / PMKID</text>
  <text x="562" y="194" text-anchor="middle" font-size="9" fill="#1e2127">variable</text>

  <!-- RSN IE / PMKID highlight -->
  <rect x="639" y="152" width="121" height="44" rx="4" ry="4" fill="#e06c75" stroke="#c0515f"/>
  <text x="699" y="168" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">RSN IE</text>
  <text x="699" y="181" text-anchor="middle" font-size="9" fill="#fff">contains PMKID</text>
  <text x="699" y="194" text-anchor="middle" font-size="9" fill="#ddd">(PMKID attack)</text>

  <!-- ===== Monitor Mode section ===== -->
  <text x="400" y="232" text-anchor="middle" font-size="13" fill="#abb2bf" font-weight="bold">Monitor Mode — Frame Capture Pipeline</text>

  <!-- Managed mode box -->
  <rect x="30" y="248" width="140" height="44" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="100" y="266" text-anchor="middle" font-size="11" fill="#abb2bf">Managed Mode</text>
  <text x="100" y="281" text-anchor="middle" font-size="10" fill="#abb2bf">wlan0 (normal)</text>
  <text x="100" y="294" text-anchor="middle" font-size="9" fill="#4b5263">filters own BSSID only</text>

  <!-- arrow -->
  <line x1="172" y1="270" x2="210" y2="270" stroke="#abb2bf" marker-end="url(#arrow)"/>
  <text x="191" y="263" text-anchor="middle" font-size="9" fill="#e5c07b">airmon-ng</text>
  <text x="191" y="283" text-anchor="middle" font-size="9" fill="#e5c07b">start wlan0</text>

  <!-- Monitor mode box -->
  <rect x="212" y="248" width="150" height="44" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="287" y="266" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Monitor Mode</text>
  <text x="287" y="281" text-anchor="middle" font-size="10" fill="#fff">wlan0mon</text>
  <text x="287" y="294" text-anchor="middle" font-size="9" fill="#ddd">captures ALL frames</text>

  <!-- arrow -->
  <line x1="364" y1="270" x2="402" y2="270" stroke="#abb2bf" marker-end="url(#arrow)"/>

  <!-- Frame types box -->
  <rect x="404" y="240" width="180" height="60" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="494" y="257" text-anchor="middle" font-size="10" fill="#e5c07b" font-weight="bold">Frame Types Captured:</text>
  <text x="494" y="270" text-anchor="middle" font-size="10" fill="#abb2bf">Management (Beacon, Probe, Auth)</text>
  <text x="494" y="282" text-anchor="middle" font-size="10" fill="#abb2bf">Control (ACK, RTS, CTS)</text>
  <text x="494" y="295" text-anchor="middle" font-size="10" fill="#98c379">Data (EAPOL handshake!)</text>

  <!-- arrow -->
  <line x1="586" y1="270" x2="624" y2="270" stroke="#abb2bf" marker-end="url(#arrow)"/>

  <!-- Tools box -->
  <rect x="626" y="240" width="154" height="60" rx="6" ry="6" fill="#61afef" stroke="#4090cf"/>
  <text x="703" y="257" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Capture Tools:</text>
  <text x="703" y="270" text-anchor="middle" font-size="10" fill="#fff">airodump-ng (passive)</text>
  <text x="703" y="283" text-anchor="middle" font-size="10" fill="#fff">hcxdumptool (active)</text>
  <text x="703" y="296" text-anchor="middle" font-size="10" fill="#fff">Wireshark (analysis)</text>

  <!-- ===== Channel hopping note ===== -->
  <rect x="30" y="316" width="740" height="36" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="400" y="331" text-anchor="middle" font-size="11" fill="#e5c07b" font-weight="bold">Key airmon-ng commands:</text>
  <text x="400" y="346" text-anchor="middle" font-size="10" fill="#abb2bf">airmon-ng check kill  →  airmon-ng start wlan0  →  airodump-ng wlan0mon  →  airodump-ng -c &lt;CH&gt; --bssid &lt;BSSID&gt; -w out wlan0mon</text>

  <!-- Legend -->
  <rect x="30" y="368" width="12" height="12" rx="2" fill="#61afef"/>
  <text x="48" y="379" font-size="10" fill="#abb2bf">MAC Header field</text>
  <rect x="170" y="368" width="12" height="12" rx="2" fill="#e06c75"/>
  <text x="188" y="379" font-size="10" fill="#abb2bf">Attack-relevant field</text>
  <rect x="330" y="368" width="12" height="12" rx="2" fill="#98c379"/>
  <text x="348" y="379" font-size="10" fill="#abb2bf">Encrypted / Payload</text>
  <rect x="490" y="368" width="12" height="12" rx="2" fill="#e5c07b"/>
  <text x="508" y="379" font-size="10" fill="#abb2bf">Crypto-relevant</text>
</svg>
