<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98c379"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" fill="#abb2bf" font-size="15" font-weight="bold">DLL Search Order &amp; SystemPropertiesAdvanced UAC Bypass</text>

  <!-- LEFT PANEL: DLL Search Order -->
  <text x="170" y="55" text-anchor="middle" fill="#abb2bf" font-size="12" font-weight="bold">Standard DLL Search Order</text>

  <!-- Steps 1-8 -->
  <rect x="30" y="64" width="280" height="32" rx="4" ry="4" fill="#4b5263" stroke="#61afef" stroke-width="1.5"/>
  <text x="40" y="80" fill="#61afef" font-size="11" font-weight="bold">1.</text>
  <text x="55" y="80" fill="#abb2bf" font-size="11">KnownDLLs registry</text>
  <text x="55" y="92" fill="#abb2bf" font-size="10">HKLM\System\...\KnownDLLs</text>

  <line x1="170" y1="96" x2="170" y2="108" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="108" width="280" height="32" rx="4" ry="4" fill="#4b5263" stroke="#61afef" stroke-width="1.5"/>
  <text x="40" y="124" fill="#61afef" font-size="11" font-weight="bold">2.</text>
  <text x="55" y="124" fill="#abb2bf" font-size="11">Same directory as EXE</text>
  <text x="55" y="136" fill="#abb2bf" font-size="10">C:\Windows\System32\</text>

  <line x1="170" y1="140" x2="170" y2="152" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="152" width="280" height="32" rx="4" ry="4" fill="#4b5263" stroke="#abb2bf" stroke-width="1"/>
  <text x="40" y="168" fill="#61afef" font-size="11" font-weight="bold">3.</text>
  <text x="55" y="168" fill="#abb2bf" font-size="11">System directory</text>
  <text x="55" y="180" fill="#abb2bf" font-size="10">C:\Windows\System32</text>

  <line x1="170" y1="184" x2="170" y2="196" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="196" width="280" height="32" rx="4" ry="4" fill="#4b5263" stroke="#abb2bf" stroke-width="1"/>
  <text x="40" y="212" fill="#61afef" font-size="11" font-weight="bold">4.</text>
  <text x="55" y="212" fill="#abb2bf" font-size="11">Windows directory</text>
  <text x="55" y="224" fill="#abb2bf" font-size="10">C:\Windows\</text>

  <line x1="170" y1="228" x2="170" y2="240" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="240" width="280" height="32" rx="4" ry="4" fill="#4b5263" stroke="#abb2bf" stroke-width="1"/>
  <text x="40" y="256" fill="#61afef" font-size="11" font-weight="bold">5.</text>
  <text x="55" y="256" fill="#abb2bf" font-size="11">Current working directory</text>

  <line x1="170" y1="272" x2="170" y2="284" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="284" width="280" height="32" rx="4" ry="4" fill="#e5c07b" stroke="#c5a05b" stroke-width="1.5"/>
  <text x="40" y="300" fill="#1e2127" font-size="11" font-weight="bold">6.</text>
  <text x="55" y="300" fill="#1e2127" font-size="11">%PATH% directories</text>
  <text x="55" y="312" fill="#1e2127" font-size="10">Often includes user-writable paths!</text>

  <!-- PATH annotation -->
  <text x="170" y="340" text-anchor="middle" fill="#e5c07b" font-size="10">★  %PATH% may include writable dirs</text>

  <!-- AppData WindowsApps -->
  <rect x="30" y="352" width="280" height="40" rx="4" ry="4" fill="#e06c75" stroke="#c0515f" stroke-width="1.5"/>
  <text x="170" y="369" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">%LOCALAPPDATA%\Microsoft\WindowsApps</text>
  <text x="170" y="385" text-anchor="middle" fill="#ffffff" font-size="10">Writable by current user — in %PATH%!</text>

  <!-- RIGHT PANEL: SystemProperties attack -->
  <text x="600" y="55" text-anchor="middle" fill="#abb2bf" font-size="12" font-weight="bold">SystemPropertiesAdvanced.exe Hijack</text>

  <!-- step 1: binary launches -->
  <rect x="490" y="64" width="220" height="42" rx="6" ry="6" fill="#4b5263" stroke="#c678dd" stroke-width="1.5"/>
  <text x="600" y="82" text-anchor="middle" fill="#c678dd" font-size="11" font-weight="bold">SystemPropertiesAdvanced.exe</text>
  <text x="600" y="98" text-anchor="middle" fill="#abb2bf" font-size="10">Auto-elevated → High Integrity</text>

  <line x1="600" y1="106" x2="600" y2="126" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 2: tries to load srrstr.dll -->
  <rect x="490" y="126" width="220" height="42" rx="6" ry="6" fill="#4b5263" stroke="#e5c07b" stroke-width="1.5"/>
  <text x="600" y="144" text-anchor="middle" fill="#e5c07b" font-size="11">Tries to load srrstr.dll</text>
  <text x="600" y="160" text-anchor="middle" fill="#abb2bf" font-size="10">(DLL for System Restore UI)</text>

  <line x1="600" y1="168" x2="600" y2="188" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 3: search in system32 - NOT FOUND -->
  <rect x="490" y="188" width="220" height="42" rx="6" ry="6" fill="#4b5263" stroke="#e06c75" stroke-width="1"/>
  <text x="600" y="206" text-anchor="middle" fill="#abb2bf" font-size="11">Search System32\srrstr.dll</text>
  <text x="600" y="222" text-anchor="middle" fill="#e06c75" font-size="10">NOT FOUND ✗</text>

  <line x1="600" y1="230" x2="600" y2="250" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 4: search PATH - WindowsApps -->
  <rect x="490" y="250" width="220" height="54" rx="6" ry="6" fill="#4b5263" stroke="#e5c07b" stroke-width="1.5"/>
  <text x="600" y="268" text-anchor="middle" fill="#e5c07b" font-size="11">Search %PATH%</text>
  <text x="600" y="284" text-anchor="middle" fill="#abb2bf" font-size="10">→ reaches WindowsApps</text>
  <text x="600" y="298" text-anchor="middle" fill="#e06c75" font-size="10">User can write here!</text>

  <!-- ATTACKER DLL placed -->
  <line x1="600" y1="304" x2="600" y2="324" stroke="#e06c75" stroke-width="2" marker-end="url(#arrow-red)"/>

  <rect x="490" y="324" width="220" height="42" rx="6" ry="6" fill="#e06c75" stroke="#c0515f" stroke-width="1.5"/>
  <text x="600" y="342" text-anchor="middle" fill="#ffffff" font-size="11">Finds srrstr.dll planted by attacker</text>
  <text x="600" y="358" text-anchor="middle" fill="#ffffff" font-size="10">in WindowsApps folder</text>

  <line x1="600" y1="366" x2="600" y2="386" stroke="#98c379" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="490" y="386" width="220" height="42" rx="6" ry="6" fill="#98c379" stroke="#78a359" stroke-width="1.5"/>
  <text x="600" y="404" text-anchor="middle" fill="#1e2127" font-size="11" font-weight="bold">DllMain executes AT</text>
  <text x="600" y="420" text-anchor="middle" fill="#1e2127" font-size="12" font-weight="bold">HIGH INTEGRITY</text>

  <!-- connector from search order to attack -->
  <line x1="310" y1="370" x2="487" y2="370" stroke="#e06c75" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="400" y="362" text-anchor="middle" fill="#e06c75" font-size="10">Attacker writes srrstr.dll here</text>

  <!-- attacker action box at bottom -->
  <rect x="30" y="410" width="280" height="56" rx="6" ry="6" fill="#4b5263" stroke="#e06c75" stroke-width="1.5"/>
  <text x="170" y="430" text-anchor="middle" fill="#e06c75" font-size="11" font-weight="bold">Attacker (Medium Integrity)</text>
  <text x="170" y="447" text-anchor="middle" fill="#abb2bf" font-size="10">Copy malicious srrstr.dll to</text>
  <text x="170" y="463" text-anchor="middle" fill="#abb2bf" font-size="10">%LOCALAPPDATA%\Microsoft\WindowsApps\</text>

  <!-- then trigger -->
  <line x1="310" y1="437" x2="487" y2="95" stroke="#e06c75" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="420" y="240" fill="#e06c75" font-size="10" transform="rotate(-75,420,240)">start SystemPropertiesAdv.exe</text>
</svg>
