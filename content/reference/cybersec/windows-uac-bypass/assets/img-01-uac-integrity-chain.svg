<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98c379"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#abb2bf" font-size="15" font-weight="bold">Windows Integrity Levels &amp; UAC Token Filtering</text>

  <!-- ── INTEGRITY LEVEL LADDER (left column) ── -->
  <!-- SYSTEM box -->
  <rect x="40" y="55" width="180" height="46" rx="6" ry="6" fill="#c678dd" stroke="#a558bd"/>
  <text x="130" y="74" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">SYSTEM</text>
  <text x="130" y="91" text-anchor="middle" fill="#ffffff" font-size="11">Integrity Level 0x4000</text>

  <!-- HIGH box -->
  <rect x="40" y="125" width="180" height="46" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="130" y="144" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">HIGH</text>
  <text x="130" y="161" text-anchor="middle" fill="#ffffff" font-size="11">Integrity Level 0x3000</text>

  <!-- MEDIUM box -->
  <rect x="40" y="195" width="180" height="46" rx="6" ry="6" fill="#e5c07b" stroke="#c5a05b"/>
  <text x="130" y="214" text-anchor="middle" fill="#1e2127" font-size="13" font-weight="bold">MEDIUM</text>
  <text x="130" y="231" text-anchor="middle" fill="#1e2127" font-size="11">Integrity Level 0x2000</text>

  <!-- LOW box -->
  <rect x="40" y="265" width="180" height="46" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="130" y="284" text-anchor="middle" fill="#abb2bf" font-size="13" font-weight="bold">LOW</text>
  <text x="130" y="301" text-anchor="middle" fill="#abb2bf" font-size="11">Integrity Level 0x1000</text>

  <!-- vertical arrow between levels -->
  <line x1="130" y1="101" x2="130" y2="122" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="130" y1="171" x2="130" y2="192" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="130" y1="241" x2="130" y2="262" stroke="#abb2bf" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- label -->
  <text x="16" y="205" fill="#abb2bf" font-size="11" transform="rotate(-90,16,205)">Privilege Level</text>

  <!-- ── TOKEN ANATOMY (middle column) ── -->
  <text x="390" y="58" text-anchor="middle" fill="#abb2bf" font-size="12" font-weight="bold">Admin Token (FULL)</text>
  <rect x="290" y="65" width="200" height="120" rx="6" ry="6" fill="#4b5263" stroke="#61afef" stroke-width="1.5"/>
  <text x="390" y="85" text-anchor="middle" fill="#61afef" font-size="11">User SID</text>
  <line x1="300" y1="90" x2="480" y2="90" stroke="#3a3f4b" stroke-width="1"/>
  <text x="390" y="105" text-anchor="middle" fill="#61afef" font-size="11">Group SIDs (Admins enabled)</text>
  <line x1="300" y1="110" x2="480" y2="110" stroke="#3a3f4b" stroke-width="1"/>
  <text x="390" y="127" text-anchor="middle" fill="#98c379" font-size="11">SeDebugPrivilege  ✓</text>
  <text x="390" y="143" text-anchor="middle" fill="#98c379" font-size="11">SeImpersonatePrivilege  ✓</text>
  <text x="390" y="159" text-anchor="middle" fill="#98c379" font-size="11">SeBackupPrivilege  ✓</text>
  <text x="390" y="175" text-anchor="middle" fill="#abb2bf" font-size="10">Integrity: HIGH (0x3000)</text>

  <text x="390" y="215" text-anchor="middle" fill="#abb2bf" font-size="12" font-weight="bold">Filtered Token (UAC strips)</text>
  <rect x="290" y="222" width="200" height="120" rx="6" ry="6" fill="#4b5263" stroke="#e5c07b" stroke-width="1.5"/>
  <text x="390" y="242" text-anchor="middle" fill="#61afef" font-size="11">User SID</text>
  <line x1="300" y1="247" x2="480" y2="247" stroke="#3a3f4b" stroke-width="1"/>
  <text x="390" y="263" text-anchor="middle" fill="#e5c07b" font-size="11">Group SIDs (Admins DISABLED)</text>
  <line x1="300" y1="268" x2="480" y2="268" stroke="#3a3f4b" stroke-width="1"/>
  <text x="390" y="285" text-anchor="middle" fill="#e06c75" font-size="11">SeDebugPrivilege  ✗</text>
  <text x="390" y="301" text-anchor="middle" fill="#e06c75" font-size="11">SeImpersonatePrivilege  ✗</text>
  <text x="390" y="317" text-anchor="middle" fill="#e06c75" font-size="11">SeBackupPrivilege  ✗</text>
  <text x="390" y="333" text-anchor="middle" fill="#abb2bf" font-size="10">Integrity: MEDIUM (0x2000)</text>

  <!-- UAC prompt arrow between two tokens -->
  <line x1="390" y1="185" x2="390" y2="219" stroke="#e06c75" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="432" y="205" fill="#e06c75" font-size="10">UAC strips</text>

  <!-- ── UAC BYPASS FLOW (right column) ── -->
  <text x="660" y="58" text-anchor="middle" fill="#abb2bf" font-size="12" font-weight="bold">UAC Bypass Flow</text>

  <!-- step 1 -->
  <rect x="570" y="65" width="180" height="40" rx="6" ry="6" fill="#4b5263" stroke="#3a3f4b"/>
  <text x="660" y="81" text-anchor="middle" fill="#abb2bf" font-size="11">Attacker shell</text>
  <text x="660" y="97" text-anchor="middle" fill="#e5c07b" font-size="11">Medium Integrity</text>

  <line x1="660" y1="105" x2="660" y2="125" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="570" y="125" width="180" height="40" rx="6" ry="6" fill="#e06c75" stroke="#c0515f"/>
  <text x="660" y="141" text-anchor="middle" fill="#ffffff" font-size="11">Auto-elevated binary</text>
  <text x="660" y="157" text-anchor="middle" fill="#ffffff" font-size="11">(fodhelper, etc.)</text>

  <line x1="660" y1="165" x2="660" y2="185" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <rect x="570" y="185" width="180" height="40" rx="6" ry="6" fill="#e5c07b" stroke="#c5a05b"/>
  <text x="660" y="201" text-anchor="middle" fill="#1e2127" font-size="11">Registry / DLL / COM</text>
  <text x="660" y="217" text-anchor="middle" fill="#1e2127" font-size="11">hijack (attacker-controlled)</text>

  <line x1="660" y1="225" x2="660" y2="245" stroke="#98c379" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- step 4: success -->
  <rect x="570" y="245" width="180" height="40" rx="6" ry="6" fill="#98c379" stroke="#78a359"/>
  <text x="660" y="261" text-anchor="middle" fill="#1e2127" font-size="11">Payload executes as</text>
  <text x="660" y="277" text-anchor="middle" fill="#1e2127" font-size="12" font-weight="bold">HIGH Integrity</text>

  <!-- no UAC prompt label -->
  <text x="660" y="306" text-anchor="middle" fill="#98c379" font-size="11">No UAC prompt shown</text>

  <!-- ── AppInfo service box ── -->
  <rect x="230" y="370" width="340" height="60" rx="6" ry="6" fill="#4b5263" stroke="#c678dd" stroke-width="1.5"/>
  <text x="400" y="392" text-anchor="middle" fill="#c678dd" font-size="12" font-weight="bold">AppInfo Service (appinfo.dll)</text>
  <text x="400" y="411" text-anchor="middle" fill="#abb2bf" font-size="11">Validates auto-elevation: path · signature · manifest</text>
  <text x="400" y="427" text-anchor="middle" fill="#abb2bf" font-size="11">Creates HIGH integrity process if all checks pass</text>

  <!-- arrows pointing to AppInfo from tokens -->
  <line x1="390" y1="342" x2="390" y2="367" stroke="#c678dd" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="660" y1="285" x2="660" y2="355" stroke="#c678dd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="660" y1="355" x2="573" y2="370" stroke="#c678dd" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- bottom note -->
  <text x="400" y="460" text-anchor="middle" fill="#e5c07b" font-size="11">★  UAC bypass = trick AppInfo into elevating attacker-controlled code</text>
  <text x="400" y="478" text-anchor="middle" fill="#abb2bf" font-size="10">Microsoft position: UAC is not a security boundary → many bypasses will never be patched</text>

  <!-- legend -->
  <rect x="40" y="355" width="14" height="14" rx="2" fill="#c678dd" stroke="#a558bd"/>
  <text x="60" y="367" fill="#abb2bf" font-size="10">SYSTEM / Privileged</text>
  <rect x="40" y="375" width="14" height="14" rx="2" fill="#e06c75" stroke="#c0515f"/>
  <text x="60" y="387" fill="#abb2bf" font-size="10">High Integrity / Attacker target</text>
  <rect x="40" y="395" width="14" height="14" rx="2" fill="#e5c07b" stroke="#c5a05b"/>
  <text x="60" y="407" fill="#abb2bf" font-size="10">Medium Integrity / Filtered token</text>
  <rect x="40" y="415" width="14" height="14" rx="2" fill="#98c379" stroke="#78a359"/>
  <text x="60" y="427" fill="#abb2bf" font-size="10">Success / Bypass achieved</text>
</svg>
