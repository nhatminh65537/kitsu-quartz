<svg viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;font-family:'Consolas','Monaco','Courier New',monospace;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#abb2bf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06c75"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98c379"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" fill="#abb2bf" font-size="15" font-weight="bold">AppInfo Service — Auto-Elevation Decision Tree</text>

  <!-- START -->
  <rect x="310" y="45" width="180" height="40" rx="20" ry="20" fill="#4b5263" stroke="#abb2bf" stroke-width="1.5"/>
  <text x="400" y="70" text-anchor="middle" fill="#abb2bf" font-size="12">Process requests elevation</text>
  <line x1="400" y1="85" x2="400" y2="108" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CHECK 1: EnableLUA? -->
  <polygon points="400,110 530,145 400,180 270,145" fill="#4b5263" stroke="#e5c07b" stroke-width="1.5"/>
  <text x="400" y="138" text-anchor="middle" fill="#e5c07b" font-size="11">EnableLUA = 1?</text>
  <text x="400" y="155" text-anchor="middle" fill="#e5c07b" font-size="10">(UAC enabled?)</text>

  <!-- NO branch left -->
  <line x1="270" y1="145" x2="80" y2="145" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="175" y="138" text-anchor="middle" fill="#abb2bf" font-size="10">No</text>
  <rect x="20" y="120" width="60" height="50" rx="6" ry="6" fill="#98c379" stroke="#78a359"/>
  <text x="50" y="140" text-anchor="middle" fill="#1e2127" font-size="10">Full Admin</text>
  <text x="50" y="155" text-anchor="middle" fill="#1e2127" font-size="10">No prompt</text>
  <text x="50" y="168" text-anchor="middle" fill="#1e2127" font-size="9">UAC disabled</text>

  <!-- YES branch down -->
  <line x1="400" y1="180" x2="400" y2="208" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="200" fill="#abb2bf" font-size="10">Yes</text>

  <!-- CHECK 2: autoElevate in manifest? -->
  <polygon points="400,210 540,248 400,286 260,248" fill="#4b5263" stroke="#e5c07b" stroke-width="1.5"/>
  <text x="400" y="240" text-anchor="middle" fill="#e5c07b" font-size="11">autoElevate=true</text>
  <text x="400" y="257" text-anchor="middle" fill="#e5c07b" font-size="10">in manifest?</text>

  <!-- NO branch: prompt user -->
  <line x1="260" y1="248" x2="80" y2="248" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="175" y="241" text-anchor="middle" fill="#abb2bf" font-size="10">No</text>
  <rect x="20" y="224" width="60" height="48" rx="6" ry="6" fill="#e5c07b" stroke="#c5a05b"/>
  <text x="50" y="243" text-anchor="middle" fill="#1e2127" font-size="10">UAC Prompt</text>
  <text x="50" y="257" text-anchor="middle" fill="#1e2127" font-size="10">shown to</text>
  <text x="50" y="269" text-anchor="middle" fill="#1e2127" font-size="10">user</text>

  <!-- YES branch down -->
  <line x1="400" y1="286" x2="400" y2="314" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="306" fill="#abb2bf" font-size="10">Yes</text>

  <!-- CHECK 3: signed by Microsoft + trusted path? -->
  <polygon points="400,316 560,358 400,400 240,358" fill="#4b5263" stroke="#e5c07b" stroke-width="1.5"/>
  <text x="400" y="349" text-anchor="middle" fill="#e5c07b" font-size="11">MS-signed AND</text>
  <text x="400" y="366" text-anchor="middle" fill="#e5c07b" font-size="10">trusted path?</text>
  <text x="400" y="381" text-anchor="middle" fill="#abb2bf" font-size="9">(System32 / Program Files)</text>

  <!-- NO branch: Prompt -->
  <line x1="240" y1="358" x2="80" y2="358" stroke="#abb2bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="175" y="351" text-anchor="middle" fill="#abb2bf" font-size="10">No</text>
  <rect x="20" y="335" width="60" height="48" rx="6" ry="6" fill="#e5c07b" stroke="#c5a05b"/>
  <text x="50" y="354" text-anchor="middle" fill="#1e2127" font-size="10">UAC Prompt</text>
  <text x="50" y="368" text-anchor="middle" fill="#1e2127" font-size="10">shown to</text>
  <text x="50" y="380" text-anchor="middle" fill="#1e2127" font-size="10">user</text>

  <!-- YES: Auto-elevate silently -->
  <line x1="400" y1="400" x2="400" y2="428" stroke="#98c379" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="415" y="420" fill="#98c379" font-size="10">Yes</text>
  <rect x="300" y="430" width="200" height="48" rx="6" ry="6" fill="#98c379" stroke="#78a359"/>
  <text x="400" y="450" text-anchor="middle" fill="#1e2127" font-size="12" font-weight="bold">AUTO-ELEVATE</text>
  <text x="400" y="468" text-anchor="middle" fill="#1e2127" font-size="11">No prompt — High Integrity</text>

  <!-- Right side: examples of whitelisted binaries -->
  <rect x="580" y="105" width="200" height="320" rx="6" ry="6" fill="#4b5263" stroke="#61afef" stroke-width="1.5"/>
  <text x="680" y="125" text-anchor="middle" fill="#61afef" font-size="12" font-weight="bold">Auto-Elevate Binaries</text>
  <text x="680" y="143" text-anchor="middle" fill="#abb2bf" font-size="10">(AppInfo hardcoded whitelist)</text>
  <line x1="590" y1="150" x2="770" y2="150" stroke="#3a3f4b" stroke-width="1"/>
  <text x="590" y="168" fill="#e06c75" font-size="11">fodhelper.exe</text>
  <text x="590" y="185" fill="#e06c75" font-size="11">computerdefaults.exe</text>
  <text x="590" y="202" fill="#e06c75" font-size="11">eventvwr.exe</text>
  <text x="590" y="219" fill="#e06c75" font-size="11">sdclt.exe</text>
  <text x="590" y="236" fill="#e06c75" font-size="11">perfmon.exe</text>
  <text x="590" y="253" fill="#e06c75" font-size="11">slui.exe</text>
  <text x="590" y="270" fill="#e06c75" font-size="11">SystemPropertiesAdv.exe</text>
  <text x="590" y="287" fill="#e06c75" font-size="11">cmstp.exe</text>
  <text x="590" y="304" fill="#e06c75" font-size="11">wsreset.exe</text>
  <line x1="590" y1="315" x2="770" y2="315" stroke="#3a3f4b" stroke-width="1"/>
  <text x="680" y="333" text-anchor="middle" fill="#e5c07b" font-size="10">All signed by Microsoft</text>
  <text x="680" y="350" text-anchor="middle" fill="#e5c07b" font-size="10">All in System32</text>
  <text x="680" y="367" text-anchor="middle" fill="#e5c07b" font-size="10">All have autoElevate=true</text>
  <text x="680" y="390" text-anchor="middle" fill="#e06c75" font-size="11" font-weight="bold">★ Abuse one of these</text>
  <text x="680" y="407" text-anchor="middle" fill="#e06c75" font-size="11">= UAC bypass</text>

  <!-- connector arrow from list to decision -->
  <line x1="580" y1="265" x2="562" y2="358" stroke="#e06c75" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>

  <!-- bottom note -->
  <text x="400" y="502" text-anchor="middle" fill="#abb2bf" font-size="10">Bypass technique = redirect execution of whitelisted binary → attacker payload</text>
  <text x="400" y="518" text-anchor="middle" fill="#e5c07b" font-size="10">via Registry hijack · DLL hijack · COM interface abuse · Env variable manipulation</text>
</svg>
